# Synthetic contract tests: no live services or credentials.
# Each alert has firing, hold-time and healthy/recovery assertions.
# Anchors share fixture data only; every scenario has explicit alert expectations.
rule_files:
  - greengateway.rules.yml
evaluation_interval: 30s
tests:

  # Startup ends at 2m; drain begins at 8m. Neither transition reaches its 10m hold at the checked times.
  - name: 'ordinary standalone startup and drain; failure counters and cluster metrics absent'
    interval: 30s
    input_series:
      - &series_up_gateway_1_standalone
        series: 'up{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '1+0x40'
      - &series_expected_gateway_1_standalone
        series: 'greengateway_monitoring:target_expected{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '1+0x40'
      - series: 'greengateway_gateway_ready{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '0+0x3 1+0x11 0+0x25'
      - series: 'greengateway_gateway_draining{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '0+0x15 1+0x24'
      - &series_depth_gateway_1_standalone
        series: 'greengateway_audit_queue_depth{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '0+0x40'
      - &series_capacity_gateway_1_standalone
        series: 'greengateway_audit_queue_capacity{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '100+0x40'
      - &series_oldest_gateway_1_standalone
        series: 'greengateway_audit_queue_oldest_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="standalone"}'
        values: '0+0x40'
    alert_rule_test:
      - {eval_time: 1m30s, alertname: GreenGatewayMetricsTargetDown, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayMetricsJobMissing, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayExpectedTargetsMissing, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayMonitoringConfigurationInvalid, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayStartupStalled, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayDrainStalled, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayAuditBacklog, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewaySchemaIncompatible, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayClusterHeartbeatStale, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewaySecurityRevisionLag, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayClusterConfigMismatch, exp_alerts: []}
      - {eval_time: 1m30s, alertname: GreenGatewayClusterMetricsMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMetricsTargetDown, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMetricsJobMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayExpectedTargetsMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMonitoringConfigurationInvalid, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayStartupStalled, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDrainStalled, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditBacklog, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewaySchemaIncompatible, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayClusterHeartbeatStale, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewaySecurityRevisionLag, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayClusterConfigMismatch, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayClusterMetricsMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}

  # Pool gauges exist. Optional security reconciliation need not emit series, and an absent failure
  # counter (an exporter from before startup seeding, or one dropped by relabeling) is not a failure.
  - name: 'healthy cluster; optional revision gauge and all failure counters absent'
    interval: 30s
    input_series:
      - &series_up_gateway_1_cluster
        series: 'up{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_expected_gateway_1_cluster
        series: 'greengateway_monitoring:target_expected{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_ready_gateway_1_cluster
        series: 'greengateway_gateway_ready{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_draining_gateway_1_cluster
        series: 'greengateway_gateway_draining{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_depth_gateway_1_cluster
        series: 'greengateway_audit_queue_depth{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_capacity_gateway_1_cluster
        series: 'greengateway_audit_queue_capacity{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '100+0x40'
      - &series_oldest_gateway_1_cluster
        series: 'greengateway_audit_queue_oldest_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_size_gateway_1_cluster
        series: 'greengateway_database_pool_size{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x40'
      - &series_available_gateway_1_cluster
        series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x40'
      - &series_waiting_gateway_1_cluster
        series: 'greengateway_database_pool_waiting{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_schema_gateway_1_cluster
        series: 'greengateway_schema_compatible{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_heartbeat_gateway_1_cluster
        series: 'greengateway_cluster_heartbeat_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_mismatch_gateway_1_cluster
        series: 'greengateway_cluster_config_mismatch{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
    alert_rule_test:
      - {eval_time: 12m, alertname: GreenGatewayMetricsTargetDown, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMetricsJobMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayExpectedTargetsMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMonitoringConfigurationInvalid, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayStartupStalled, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDrainStalled, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditBacklog, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewaySchemaIncompatible, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayClusterHeartbeatStale, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewaySecurityRevisionLag, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayClusterConfigMismatch, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayClusterMetricsMissing, exp_alerts: []}

  # Only gateway-1 is faulty. Exact expected labels exclude reason, outcome, operation, actor and detail.
  - name: 'sustained serving faults fire after holds and recover per replica'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - &series_depth_gateway_1_cluster_2
        series: 'greengateway_audit_queue_depth{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '90+0x24 0+0x15'
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - &series_available_gateway_1_cluster_2
        series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x24 10+0x15'
      - &series_waiting_gateway_1_cluster_2
        series: 'greengateway_database_pool_waiting{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '3+0x24 0+0x15'
      - series: 'greengateway_schema_compatible{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x24 1+0x15'
      - series: 'greengateway_cluster_heartbeat_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '30+0x24 0+0x15'
      - series: 'greengateway_cluster_config_mismatch{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x24 0+0x15'
      - &series_revision_gateway_1_cluster
        series: 'greengateway_security_revision_lag{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '2+0x24 0+0x15'
      - &series_up_gateway_2_cluster
        series: 'up{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_expected_gateway_2_cluster
        series: 'greengateway_monitoring:target_expected{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_ready_gateway_2_cluster
        series: 'greengateway_gateway_ready{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_draining_gateway_2_cluster
        series: 'greengateway_gateway_draining{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_depth_gateway_2_cluster
        series: 'greengateway_audit_queue_depth{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_capacity_gateway_2_cluster
        series: 'greengateway_audit_queue_capacity{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '100+0x40'
      - &series_oldest_gateway_2_cluster
        series: 'greengateway_audit_queue_oldest_age_seconds{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_size_gateway_2_cluster
        series: 'greengateway_database_pool_size{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '10+0x40'
      - &series_available_gateway_2_cluster
        series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '10+0x40'
      - &series_waiting_gateway_2_cluster
        series: 'greengateway_database_pool_waiting{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_schema_gateway_2_cluster
        series: 'greengateway_schema_compatible{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_heartbeat_gateway_2_cluster
        series: 'greengateway_cluster_heartbeat_age_seconds{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_mismatch_gateway_2_cluster
        series: 'greengateway_cluster_config_mismatch{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="sink_error",actor="fixture-actor"}'
        values: '0+1x24 24+0x15'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",outcome="failure",detail="fixture-detail"}'
        values: '0+1x24 24+0x15'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",operation="fixture-operation"}'
        values: '0+1x24 24+0x15'
    alert_rule_test:
      - {eval_time: 2m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - eval_time: 2m30s
        alertname: GreenGatewayAuditLoss
        exp_alerts:
          - &fires_audit_loss_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: &annotations_audit_loss
              summary: 'Gateway audit events were dropped'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-delivery'
      - {eval_time: 12m, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 18m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - eval_time: 2m30s
        alertname: GreenGatewayAuditFlushFailures
        exp_alerts:
          - &fires_audit_flush_failures_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_audit_flush_failures
              summary: 'Gateway audit sink flushes are failing'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-delivery'
      - {eval_time: 12m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 18m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - eval_time: 2m30s
        alertname: GreenGatewayDatabasePoolTimeouts
        exp_alerts:
          - &fires_database_pool_timeouts_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_database_pool_timeouts
              summary: 'Gateway database pool acquisitions are timing out'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#database-capacity'
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 18m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayAuditBacklog, exp_alerts: []}
      - eval_time: 5m
        alertname: GreenGatewayAuditBacklog
        exp_alerts:
          - &fires_audit_backlog_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_audit_backlog
              summary: 'Gateway audit delivery backlog is sustained'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-delivery'
      - {eval_time: 12m, alertname: GreenGatewayAuditBacklog, exp_alerts: [*fires_audit_backlog_gateway_1_cluster]}
      - {eval_time: 13m, alertname: GreenGatewayAuditBacklog, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}
      - eval_time: 5m
        alertname: GreenGatewayDatabasePoolSaturated
        exp_alerts:
          - &fires_database_pool_saturated_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_database_pool_saturated
              summary: 'Gateway database callers are waiting with no free pool connections'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#database-capacity'
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: [*fires_database_pool_saturated_gateway_1_cluster]}
      - {eval_time: 13m, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}
      - {eval_time: 0m30s, alertname: GreenGatewaySchemaIncompatible, exp_alerts: []}
      - eval_time: 1m
        alertname: GreenGatewaySchemaIncompatible
        exp_alerts:
          - &fires_schema_incompatible_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: &annotations_schema_incompatible
              summary: 'Gateway observed an incompatible database schema'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority'
      - {eval_time: 12m, alertname: GreenGatewaySchemaIncompatible, exp_alerts: [*fires_schema_incompatible_gateway_1_cluster]}
      - {eval_time: 13m, alertname: GreenGatewaySchemaIncompatible, exp_alerts: []}
      - {eval_time: 0m30s, alertname: GreenGatewayClusterHeartbeatStale, exp_alerts: []}
      - eval_time: 1m
        alertname: GreenGatewayClusterHeartbeatStale
        exp_alerts:
          - &fires_cluster_heartbeat_stale_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_cluster_heartbeat_stale
              summary: 'Gateway membership heartbeat has reached the example stale window'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority'
      - {eval_time: 12m, alertname: GreenGatewayClusterHeartbeatStale, exp_alerts: [*fires_cluster_heartbeat_stale_gateway_1_cluster]}
      - {eval_time: 13m, alertname: GreenGatewayClusterHeartbeatStale, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewaySecurityRevisionLag, exp_alerts: []}
      - eval_time: 5m
        alertname: GreenGatewaySecurityRevisionLag
        exp_alerts:
          - &fires_security_revision_lag_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_security_revision_lag
              summary: 'Gateway security revision lag is sustained'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority'
      - {eval_time: 12m, alertname: GreenGatewaySecurityRevisionLag, exp_alerts: [*fires_security_revision_lag_gateway_1_cluster]}
      - {eval_time: 13m, alertname: GreenGatewaySecurityRevisionLag, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayClusterConfigMismatch, exp_alerts: []}
      - eval_time: 5m
        alertname: GreenGatewayClusterConfigMismatch
        exp_alerts:
          - &fires_cluster_config_mismatch_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations: &annotations_cluster_config_mismatch
              summary: 'Gateway configuration fingerprint has not converged'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority'
      - {eval_time: 12m, alertname: GreenGatewayClusterConfigMismatch, exp_alerts: [*fires_cluster_config_mismatch_gateway_1_cluster]}
      - {eval_time: 13m, alertname: GreenGatewayClusterConfigMismatch, exp_alerts: []}

  - name: 'oldest queued event alerts even when queue depth is zero'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - series: 'greengateway_audit_queue_oldest_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '31+0x10 30+0x29'
      - *series_size_gateway_1_cluster
      - *series_available_gateway_1_cluster
      - *series_waiting_gateway_1_cluster
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
    alert_rule_test:
      - {eval_time: 4m30s, alertname: GreenGatewayAuditBacklog, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuditBacklog, exp_alerts: [*fires_audit_backlog_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayAuditBacklog, exp_alerts: []}

  - name: 'audit queue threshold equality is healthy'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
