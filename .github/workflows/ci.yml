name: CI

"on":
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:

permissions:
  contents: read

# A new push cancels the old run immediately, including candidate builds and
# any pending promotion. Keep this distinct from the promotion job's lock.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  microbench:
    name: microbench
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Node builds the admin UI that gateway/build.rs embeds in the gateway
      # test binary carrying the HTTP policy benchmark.
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - run: python -m pip install PyYAML==6.0.3
      - name: Resolve immutable comparison commits
        id: revisions
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          def commit(value):
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise ValueError("comparison requires a full commit SHA")
              resolved = subprocess.check_output(
                  ["git", "rev-parse", "--verify", value + "^{commit}"], text=True
              ).strip()
              if resolved != value:
                  raise ValueError("comparison SHA did not resolve to itself")
              return value

          head = commit(os.environ["EVENT_HEAD_SHA"])
          checkout = subprocess.check_output(
              ["git", "rev-parse", "--verify", "HEAD"], text=True
          ).strip()
          if checkout != head:
              raise ValueError("checkout does not match the event commit")
          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              base = commit(os.environ["EVENT_BASE_SHA"])
              head_kind = "pull_request_merge"
          elif event == "push":
              ref_type = os.environ["EVENT_REF_TYPE"]
              if ref_type == "branch":
                  base = commit(os.environ["EVENT_BEFORE_SHA"])
                  if base == head:
                      raise ValueError("branch push has no new commit")
                  subprocess.run(
                      ["git", "merge-base", "--is-ancestor", base, head],
                      check=True,
                  )
                  head_kind = "push_branch"
              elif ref_type == "tag":
                  base = commit(subprocess.check_output(
                      ["git", "rev-parse", "--verify", head + "^"], text=True
                  ).strip())
                  head_kind = "push_tag"
              else:
                  raise ValueError("unsupported push ref type")
          else:
              raise ValueError("unsupported microbenchmark event")
          output = Path("target/microbench")
          output.mkdir(parents=True, exist_ok=True)
          (output / "workflow.json").write_text(json.dumps({
              "schema_version": 1, "event_name": event,
              "base_sha": base, "head_sha": head, "head_kind": head_kind,
          }, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"base={base}\nhead={head}\n")
          PY
      - name: Exercise comparison and workflow rejection fixtures
        run: python -m unittest discover -s scripts -p 'test_microbench*.py' -v
      - name: Check standalone benchmark formatting
        run: rustfmt --edition 2021 --check scripts/benchmarks/pure_paths.rs
      - name: Compare pure-path and HTTP policy allocation budgets
        id: benchmark
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base }}
          HEAD_SHA: ${{ steps.revisions.outputs.head }}
        run: python scripts/microbench.py run --base "$BASE_SHA" --head "$HEAD_SHA" --output target/microbench
      - name: Preserve base, head and comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microbench-${{ github.sha }}
          path: target/microbench/
          if-no-files-found: error
          retention-days: 30

  security-corpus:
    name: security-corpus
    # Required on every PR, main push and version tag. The runner builds the
    # actual gateway test binary once before applying its smaller corpus budget.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      # One dependency cache serves every job that builds the default-feature
      # test graph without RUSTFLAGS; see postgres-foundation-pg.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: postgres-foundation
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install workflow test parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test bounded corpus runner
        run: python scripts/test_security_corpus.py
      - name: Verify corpus workflow contracts
        run: python scripts/test_security_corpus_workflows.py
      - name: Run committed corpus and fixed mutations
        run: python scripts/security_corpus.py --mode regression --report target/security-corpus/report.json
      - name: Preserve redacted corpus decision
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-corpus
          path: target/security-corpus/report.json
          if-no-files-found: error
          retention-days: 14

  security-coverage:
    name: security-coverage
    # Match the pinned compiler/platform used to establish these branch floors.
    # The normal Linux and PostgreSQL jobs remain separate release requirements.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: coverage
          node: 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target/llvm-cov-target"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install the pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.0 --locked
      - name: Compile the instrumented gateway crate faster
        # The gateway crate is one 350,000-line compilation unit: its
        # single-threaded front end, its debug information and a
        # single-threaded link were most of this job. Three settings for that
        # one package, none of which changes what is instrumented, run or
        # measured (the coverage report has the same lines, branches,
        # functions and regions with and without them; see
        # docs/testing/security-coverage.md):
        #   - `debug = 0`: coverage is read from the instrumentation's
        #     counters and coverage mapping, never from debug information.
        #     Panic messages keep their file and line.
        #   - `-Zthreads=4`: the nightly compiler's parallel front end on the
        #     runner's four vCPUs.
        #   - `-Clinker=rust-lld`: the LLVM linker shipped inside this pinned
        #     toolchain links the test binary instead of the runner image's
        #     MSVC linker.
        # They name only the gateway package, so every cached dependency
        # keeps its fingerprint, and they live in this runner's user-level
        # Cargo configuration, not the repository's. If one of them ever made
        # the report count fewer lines or branches for a gated file, the
        # denominators recorded in .github/security-coverage.json fail the
        # floor check instead of letting the percentage rise.
        shell: pwsh
        run: |
          $config = Join-Path $env:CARGO_HOME 'config.toml'
          Add-Content -Path $config -Encoding utf8 -Value @(
            '[unstable]',
            'profile-rustflags = true',
            '[profile.test.package.gateway]',
            'debug = 0',
            'rustflags = ["-Zthreads=4", "-Clinker=rust-lld"]'
          )
          Get-Content -Path $config
      - name: Measure operator CLI security branches
        # ggctl (issue #242, ADR-0008) is its own package with its own tests,
        # so it is measured in its own run and the gateway measurement below
        # stays exactly the run its floors were set against. Its integration
        # tests run the instrumented ggctl binary itself. A failure here skips
        # the gateway measurement, so the floor check and the evidence upload
        # never run on a partial result.
        run: cargo llvm-cov --no-rustc-wrapper --branch --json --output-path target/ggctl-security-coverage.json -p ggctl --locked --jobs 4
      - name: Measure security branches
        id: coverage
        # The mandatory uninstrumented test job enforces the SQLite wall-clock
        # budget. Instrumentation changes that measurement on hosted Windows.
        # `--jobs 4` matches the runner's four vCPUs. The job count only
        # bounds how many compiler threads run at once (the single gateway
        # crate dominates the build); it changes neither the instrumentation
        # nor the tests, so the floors measure exactly what they did.
        run: cargo llvm-cov --no-rustc-wrapper --branch --json --output-path target/security-coverage.json -p gateway --bin gateway --locked --jobs 4 -- --test-threads=8 --skip audit::sqlite_sink::tests::moderate_scale_batched_inserts_complete_quickly
      - name: Enforce production-code coverage floors
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: python scripts/check-security-coverage.py target/security-coverage.json target/ggctl-security-coverage.json
      - name: Preserve coverage evidence
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-coverage
          path: |
            target/security-coverage.json
            target/ggctl-security-coverage.json
          if-no-files-found: error
      - name: Preserve available coverage failure diagnostics
        if: ${{ always() && steps.coverage.outcome != 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-coverage-diagnostics
          path: |
            target/security-coverage.json
            target/ggctl-security-coverage.json
          if-no-files-found: ignore

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'true'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s scripts -p 'test_build_tools.py' -v
      - run: node scripts/npm-script-policy.mjs check
      - run: node --test scripts/test-npm-script-policy.mjs
      - run: node scripts/check-authority-evidence.mjs
      - run: node --test scripts/test-authority-evidence.mjs
      - run: python -m unittest discover -s scripts -p 'test_npm_script_policy.py' -v
      - run: python3 scripts/check-supply-chain.py
      - run: python3 scripts/test_security_gates.py
      - name: Test the security mutation registry checks
        # Only the controller tests that need no compiler or child process.
        # Calibration and process-limit tests stay in security-mutations.yml.
        run: python scripts/test_security_mutations.py ManifestTests TestListTests
      - name: Verify security mutation workflow contracts
        run: python scripts/test_security_mutations_workflows.py
      - name: Check the security mutation registry for drift
        # Registry and source reconciliation only: nothing is compiled, tested
        # or mutated. The complete campaign stays in security-mutations.yml.
        run: python scripts/security_mutations.py --validate-registry
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  operational-alerts:
    name: operational-alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - run: python -m pip install PyYAML==6.0.3
      - name: Install checksum-verified rule validator
        run: python scripts/alert_rules.py install
      - name: Exercise validator rejection fixtures
        run: python -m unittest discover -s scripts -p test_alert_rules.py -v
      - name: Validate alert rules and firing/recovery fixtures
        run: python scripts/alert_rules.py check
      - name: Preserve alert validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operational-alerts
          path: target/alert-rules/
          if-no-files-found: error
          retention-days: 30

  cargo-policy:
    name: cargo-policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'false'
      - name: Install checksum-verified Cargo policy tool
        run: python scripts/cargo_policy.py install
      - name: Exercise policy and native tool rejection fixtures
        run: python -m unittest discover -s scripts -p 'test_cargo_policy.py' -v
      - name: Check the locked full workspace graph
        run: python scripts/cargo_policy.py check
      - name: Retain policy decisions and exact exception evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-policy-${{ matrix.os }}
          path: target/cargo-policy/
          if-no-files-found: error

  egress-only:
    name: egress-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      # The transport guard compiles every gateway dependency, dev
      # dependencies included, to run its example; without a cache that was
      # a cold dependency build per run. It is the default-feature test
      # graph, so it shares postgres-foundation-pg's cache.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: postgres-foundation
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Enforce egress-only outbound HTTP
        run: bash scripts/check-egress-only.sh
      - name: Test the egress-only operator client pin
        run: python -m unittest discover -s scripts -p test_egress_only.py -v
      - name: Enforce structural transport ownership
        run: python scripts/transport_guard.py check
      - name: Test structural transport guard
        run: |
          cargo test --locked --example transport_guard
          python -m unittest discover -s scripts -p test_transport_guard.py -v
      - name: Upload transport ownership decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-ownership
          path: target/transport-guard/
          if-no-files-found: error

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      # `cargo fmt` compiles nothing, so this job restores no Rust cache.
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Lint
        run: cargo clippy --workspace --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Clippy denies warnings in non-test code, and in test code only without
    # the `postgres` feature. Deny compiler warnings in this default-feature
    # test build too, so a discarded `must_use` result in a database-backed
    # test fails here instead of passing as a log line. Job-level so the Rust
    # cache keys on it.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --locked

      - name: Check security mutation registry tests still exist
        # Lists the test binaries the Test step just built and ran; nothing is
        # rebuilt, run or mutated. A selected test that was renamed, deleted or
        # duplicated fails here rather than in the scheduled campaign.
        shell: bash
        run: |
          mkdir -p target/security-mutations
          cargo test --workspace --locked -- --list --format terse > target/security-mutations/test-list.txt
          python scripts/security_mutations.py --check-test-list target/security-mutations/test-list.txt

  # The operator CLI and the library it shares with the gateway (issue #242,
  # ADR-0008), on every platform it is released for. The `test` job already
  # runs both on Linux as part of the workspace; this adds macOS and Windows,
  # where terminal detection, file permissions, path handling and the
  # platform certificate verifier differ. Neither package has a build script
  # or embeds the admin UI, so nothing here builds Node assets; the tool
  # contract still installs Node for every job that runs `cargo test`.
  ggctl:
    name: ggctl (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The integration tests run the built binary itself: exit codes,
      # standard streams, token files and loopback HTTPS.
      - name: Test the operator CLI and the shared configuration library
        run: cargo test --locked -p ggctl -p gateway-config

  # PostgreSQL foundation (issue #241, PR 3): the gateway suite against a real
  # PostgreSQL 16 service container, in both feature states.
  #
  # The test DSN uses the documented `loopback-dev` TLS exception because the
  # GitHub-hosted service container is reachable only over loopback plaintext
  # -- exactly the shape the exception exists for. Full verified-TLS coverage
  # (server certificate + hostname verification against a configured CA) is
  # exercised in the TLS-focused suites of later #241 PRs, which bring up
  # their own TLS-capable database rather than sharing this one.
  #
  # `POSTGRES_HOST_AUTH_METHOD: trust` means the CI DSN carries no password:
  # there is no secret to leak and nothing for gitleaks to flag. The
  # disposable database is recreated per run.
  #
  # The job's three passes -- the suite against PostgreSQL with the feature
  # on, the suite without the feature, and the lint without the feature --
  # share no build, so they run as three parallel shards. The required
  # `postgres-foundation` check is the aggregator below: it passes only when
  # every shard reports `success`, so a failed, skipped or cancelled shard
  # fails the check rather than disappearing from it.
  postgres-foundation-pg:
    name: postgres-foundation-pg
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: greengateway_ci
          POSTGRES_DB: greengateway_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greengateway_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # The dependency cache of the default-feature test graph built
          # without RUSTFLAGS, under the key this pass has always used. The
          # HA legs, security-corpus and egress-only build that same graph
          # and share it, instead of each keeping its own copy of it in the
          # repository's 10 GB cache budget.
          shared-key: postgres-foundation
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Write the test DSN files
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pg"
          printf 'postgres://greengateway_ci@127.0.0.1:5432/greengateway_ci\n' \
            > "${RUNNER_TEMP}/pg/database-url"
          printf 'postgres://ggw_runtime_noddl@127.0.0.1:5432/greengateway_ci\n' \
            > "${RUNNER_TEMP}/pg/database-url-noddl"
          chmod 0600 "${RUNNER_TEMP}/pg/database-url" "${RUNNER_TEMP}/pg/database-url-noddl"

      - name: Create the no-DDL runtime role
        # The privilege-boundary test migrates as the privileged role, grants
        # the runtime role read access, then proves the runtime role can
        # validate but cannot create schema. Trust auth means no password
        # anywhere for gitleaks to flag. Service containers get generated
        # names, so resolve this job's postgres container rather than
        # guessing it.
        run: |
          set -eu
          PG_CONTAINER="$(docker ps --filter 'name=postgres' --format '{{.Names}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" psql -U greengateway_ci -d greengateway_ci \
            -c "CREATE ROLE ggw_runtime_noddl LOGIN;"

      - name: Test against a real PostgreSQL (feature on)
        env:
          GATEWAY_TEST_POSTGRES_URL_FILE: ${{ runner.temp }}/pg/database-url
          GATEWAY_TEST_POSTGRES_NODDL_URL_FILE: ${{ runner.temp }}/pg/database-url-noddl
        run: cargo test -p gateway --locked

  # The second pass. It never set the PostgreSQL locator, so it needs no
  # database service.
  postgres-foundation-no-default:
    name: postgres-foundation-no-default
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Test without the postgres feature
        run: cargo test -p gateway --locked --no-default-features

  postgres-foundation-lint:
    name: postgres-foundation-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Lint without the postgres feature
        run: cargo clippy -p gateway --locked --no-default-features --all-targets -- -D warnings

  # The required check. `always()` makes it run, and fail, when a shard
  # failed, was skipped or was cancelled: a required job skipped because a
  # dependency failed would otherwise report as passing.
  postgres-foundation:
    name: postgres-foundation
    needs:
      - postgres-foundation-pg
      - postgres-foundation-no-default
      - postgres-foundation-lint
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Require every PostgreSQL foundation pass
        shell: bash
        env:
          FEATURE_ON_RESULT: ${{ needs.postgres-foundation-pg.result }}
          NO_DEFAULT_RESULT: ${{ needs.postgres-foundation-no-default.result }}
          LINT_RESULT: ${{ needs.postgres-foundation-lint.result }}
        run: |
          status=0
          for shard in "postgres-foundation-pg=${FEATURE_ON_RESULT:-}" \
                       "postgres-foundation-no-default=${NO_DEFAULT_RESULT:-}" \
                       "postgres-foundation-lint=${LINT_RESULT:-}"; do
            name="${shard%%=*}"
            result="${shard#*=}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name} completed with result '${result}'"
              status=1
            fi
          done
          exit "${status}"

  admin-ui:
    name: admin-ui
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build gateway for live admin UI
        timeout-minutes: 15
        run: cargo build --locked -p gateway

      - name: Install admin UI dependencies
        working-directory: admin-ui
        run: node ../scripts/npm-script-policy.mjs install admin-ui

      - name: Test admin UI
        working-directory: admin-ui
        run: npm test

      - name: Audit admin UI dependencies
        working-directory: admin-ui
        run: npm audit --audit-level=high

      - name: Build admin UI
        working-directory: admin-ui
        run: npm run build

      - name: Install Chromium
        working-directory: admin-ui
        run: npx --no-install playwright install --with-deps chromium

      - name: Test live Connection admin UI
        id: live-ui
        working-directory: admin-ui
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/admin-ui-live.json
        run: npx --no-install playwright test --config playwright.issue240.config.ts --reporter=line,json

      - name: Validate live admin UI evidence
        if: ${{ always() && steps.live-ui.outcome == 'success' }}
        run: python scripts/check-test-evidence.py playwright "${{ runner.temp }}/admin-ui-live.json" admin-ui/playwright-report/live-summary.json

      - name: Retain live admin UI evidence
        if: ${{ always() && steps.live-ui.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-live-evidence
          path: admin-ui/playwright-report/live-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Test admin UI screenshots
        id: screenshots
        working-directory: admin-ui
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/admin-ui-screenshots.json
        run: npm run screenshots -- --reporter=line,json

      - name: Validate screenshot and report groups
        if: ${{ always() && steps.screenshots.outcome == 'success' }}
        run: python scripts/check-test-evidence.py playwright "${{ runner.temp }}/admin-ui-screenshots.json" admin-ui/playwright-report/screenshots-summary.json --screenshots admin-ui/.screenshots

      - name: Retain required screenshot evidence
        if: ${{ always() && steps.screenshots.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-screenshot-evidence
          path: |
            admin-ui/.screenshots/**/*.png
            admin-ui/playwright-report/screenshots-summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Retain available admin UI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-ui-test-diagnostics
          path: |
            admin-ui/.screenshots/**/*.png
            admin-ui/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  npm-policy-windows:
    name: npm-policy-windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'true'
      - name: Verify current review inventory
        run: node scripts/npm-script-policy.mjs check
      - name: Test review gate regressions
        run: node --test scripts/test-npm-script-policy.mjs
      - name: Test real npm lifecycle behavior
        run: python -m unittest discover -s scripts -p 'test_npm_script_policy.py' -v
      - name: Clean install admin UI with dependency hooks denied
        run: node scripts/npm-script-policy.mjs install admin-ui
      - name: Test admin UI on Windows
        working-directory: admin-ui
        run: npm test
      - name: Build admin UI on Windows
        working-directory: admin-ui
        run: npm run build
      - name: Clean install root with dependency hooks denied
        run: node scripts/npm-script-policy.mjs install .
      - name: Test root on Windows
        run: npm test
      - name: Typecheck root on Windows
        run: npm run typecheck

  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'true'
      - name: Install Cloudflare wrapper dependencies
        run: node scripts/npm-script-policy.mjs install .

      - name: Test Cloudflare wrapper
        run: npm test

      - name: Audit Cloudflare dependencies
        run: npm audit --audit-level=high

      - name: Type-check Cloudflare wrapper
        run: npm run typecheck

  # The production image, built once per run from this checkout's Dockerfile
  # for every job that exercises it: ha-compose-example, dev-traffic-smoke and
  # the PR preview scan. Each of those used to build the same image itself.
  # It is handed over as this run's artifact, never pushed: the job holds
  # read-only permissions and no registry credentials. Consumers load it
  # through ./.github/actions/gateway-image, which requires this job's
  # success and checks the loaded image ID against `image-id`.
  gateway-image:
    name: gateway-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image-id: ${{ steps.export.outputs.image-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Set up verified Buildx and pinned BuildKit
        uses: ./.github/actions/buildx
      - name: Build the production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: greengateway:ci
      - name: Export the image for this run
        id: export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gateway-image"
          docker save --output "${RUNNER_TEMP}/gateway-image/gateway-image.tar" greengateway:ci
          image_id="$(docker image inspect --format '{{.Id}}' greengateway:ci)"
          [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image-id=${image_id}" >> "${GITHUB_OUTPUT}"
      - name: Hand the image to this run's consumers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gateway-image
          path: ${{ runner.temp }}/gateway-image/gateway-image.tar
          if-no-files-found: error
          retention-days: 1

  ha-compose-example:
    name: ha-compose-example
    needs: gateway-image
    # Runs, and fails in the image step, when gateway-image did not succeed:
    # skipping instead would report this required check as passing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validate syntax, then rehearse the actual runbook against an isolated DB.
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Validate the HA compose example
        shell: bash
        run: |
          set -eu

          example=docs/deployment/docker-compose.ha.yml

          # The default set: db, migrate, the two gateways and the load
          # balancer.
          docker compose -f "$example" config --quiet

          # Services behind a profile are NOT included above, so they need
          # their own pass or a typo in the bootstrap or import service ships
          # unchecked.
          docker compose -f "$example" \
            --profile bootstrap --profile import config --quiet

          # The single PostgreSQL container must stay labelled as an example.
          # This is the one claim in the file an operator can be harmed by
          # losing, so it is asserted rather than trusted to review.
          grep -qi 'EXAMPLE ONLY' "$example"

      # Every shipped Compose and Kubernetes example must fit its PostgreSQL
      # connection budget, so an example change cannot over-commit the server.
      # The guard reads YAML with its own reader for the subset deployment
      # files use, which is not a full YAML parser, so Compose's rendering of
      # the HA example, both profiles included, must agree with its reading.
      - name: Check the shipped examples' PostgreSQL connection budgets
        shell: bash
        run: |
          set -eu
          python -m unittest discover -s scripts -p test_pool_sizing.py -v
          mkdir -p target/pool-sizing
          docker compose -f docs/deployment/docker-compose.ha.yml \
            --profile bootstrap --profile import config --format json \
            > target/pool-sizing/docker-compose.ha.json
          python scripts/pool_sizing.py examples --rendered docs/deployment/docker-compose.ha.yml=target/pool-sizing/docker-compose.ha.json

      - name: Load the production image
        uses: ./.github/actions/gateway-image
        with:
          producer-result: ${{ needs.gateway-image.result }}
          image-id: ${{ needs.gateway-image.outputs.image-id }}
          tag: greengateway:bootstrap

      - name: Rehearse clean bootstrap and restore
        run: sudo python3 scripts/check-ha-bootstrap.py --image greengateway:bootstrap

  dev-traffic-smoke:
    name: dev-traffic-smoke
    needs: gateway-image
    # As for ha-compose-example: run, and fail, unless the image was built.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'true'
      # Static checks of the production qualification kit
      # (docs/deployment/qualification.md): its fixtures, the shipped example
      # manifests it judges, the example load profile and the evidence
      # template. Offline and loopback only; no cluster and no image needed.
      - name: Check the production qualification kit
        shell: bash
        run: |
          set -eu
          python -m unittest discover -s scripts -p test_qualification.py -v
          node scripts/run-load-suite.mjs --profile docs/deployment/qualification/load-profile.example.json --validate-only
          python scripts/qualification.py netpol --cases docs/deployment/qualification/netpol-cases.example.json --plan > /dev/null
          python scripts/qualification.py evidence docs/deployment/qualification/evidence-template.json

      # Compose names the gateway service's image `<project>-gateway`; the
      # project is pinned below so that name is fixed, and `--no-build` runs
      # exactly this run's production image (Compose's build of the same
      # context and Dockerfile is what produced it before).
      - name: Load the production image
        uses: ./.github/actions/gateway-image
        with:
          producer-result: ${{ needs.gateway-image.result }}
          image-id: ${{ needs.gateway-image.outputs.image-id }}
          tag: greengateway-dev-gateway
      - name: Run dev traffic smoke test
        id: dev-smoke
        shell: bash
        run: |
          set -eu

          node scripts/init-dev-jwks.mjs
          compose_files=(-p greengateway-dev -f docker-compose.yml -f docker-compose.dev.yml)
          trap 'docker compose -p greengateway-dev -f docker-compose.yml -f docker-compose.dev.yml down -v || true' EXIT

          docker compose "${compose_files[@]}" up -d --no-build

          healthy=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose "${compose_files[@]}" logs gateway dev-jwks dev-echo-a dev-echo-b dev-echo-c
            exit 1
          fi

          set +e
          node scripts/generate-traffic.mjs --smoke-test
          smoke_status=$?
          if [ "$smoke_status" -eq 0 ]; then
            node scripts/verify-dev-pool.mjs healthy
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            # The healthy-pool check deliberately sends a POST burst. Refill
            # the default write bucket (20 tokens, 10/s) before independently
            # asserting successful streaming; keep rate limiting enabled.
            sleep 3
            node scripts/proxy-load.mjs \
              --path /__dev-stream \
              --method POST \
              --body-bytes 1048576 \
              --response-bytes 128 \
              --concurrency 1 \
              --requests 3 \
              --output artifacts/proxy-load/ci-stream.json
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            docker compose "${compose_files[@]}" stop dev-echo-b
            node scripts/verify-dev-pool.mjs degraded --endpoint dev-echo-b
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            docker compose "${compose_files[@]}" start dev-echo-b
            node scripts/verify-dev-pool.mjs recovered --endpoint dev-echo-b
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            docker compose "${compose_files[@]}" stop dev-echo-a dev-echo-b dev-echo-c
            node scripts/verify-dev-pool.mjs unavailable
            smoke_status=$?
          fi
          set -e

          if [ "$smoke_status" -ne 0 ]; then
            docker compose "${compose_files[@]}" logs gateway dev-jwks dev-echo-a dev-echo-b dev-echo-c
          fi

          exit "$smoke_status"

      - name: Validate stream evidence
        if: ${{ always() && steps.dev-smoke.outcome == 'success' }}
        run: python scripts/check-test-evidence.py stream artifacts/proxy-load/ci-stream.json artifacts/proxy-load/ci-stream-summary.json

      - name: Retain stream evidence
        if: ${{ always() && steps.dev-smoke.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-stream-evidence
          path: artifacts/proxy-load/ci-stream-summary.json
          if-no-files-found: error
          retention-days: 7

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      # `cargo audit` reads Cargo.lock and the advisory database and compiles
      # nothing, so this job restores no Rust cache.
      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit@0.22.2
          checksum: true

      - name: Audit dependencies
        run: cargo audit --deny warnings

  # The #241 multi-replica release gate. Each suite under `gateway/tests/ha/`
  # stands up two REAL gateway processes in cluster mode against this job's
  # PostgreSQL service, so the work is minutes per file rather than seconds:
  # the matrix runs one target per job, which is what keeps the gate inside
  # its budget.
  #
  # The service and DSN-file setup is `postgres-foundation`'s, deliberately.
  # The one difference is the runtime role: that job creates a shared
  # `ggw_runtime_noddl`, while this harness creates a disposable database
  # AND a disposable no-DDL role per test and drops both, so a fault it
  # injects (a revoked CONNECT, a read-only default) can never reach a
  # sibling.
  #
  # `GATEWAY_TEST_HA_GATE` is the opt-in these suites also require. Without
  # it they skip, which is what stops `postgres-foundation` -- which runs
  # `cargo test -p gateway` with the same locator -- from paying for this
  # gate a second time inside a budget sized for the unit suites.
  #
  # `ha_performance` is deliberately NOT in this matrix. Its five benchmarks
  # are `#[ignore]`d and belong to `nightly-performance.yml`, which runs them
  # `--release` and single-threaded because a debug build measures the wrong
  # thing and a parallel run measures contention the budgets do not describe.
  # Its one always-on test reads `docs/architecture/ha-state-model.md` and
  # needs no database, so `cargo test --workspace` in the `test` job already
  # runs it on every pull request -- adding a matrix leg here would buy a
  # cold build to re-run one filesystem read.
  #
  # The legs compile nothing. Each leg used to run `cargo test -p gateway
  # --test <suite>`, so eight jobs built the same gateway executable and the
  # rolling-upgrade leg built its pinned pair before its suite could start.
  # ha-release-gate-build now runs that build once for all eight suites --
  # same package, features, profile and flags, so the same executables -- and
  # ha-upgrade-pair builds the pair alongside it. A leg requires its
  # producer's success and unpacks an archive only when its SHA-256 matches
  # the one the producer recorded, then runs the suite's test executable
  # exactly as `cargo test` did: from the package directory, with the same
  # libtest arguments and the same anti-vacuity guards.
  ha-release-gate-build:
    name: ha-release-gate-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      archive-sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      # Exactly the ha-release-gate matrix: scripts/test_security_gates.py
      # fails when the two lists differ.
      SUITES: >-
        ha_smoke ha_security_two_replica ha_events_discovery_leader
        ha_saturation ha_secret_leak ha_failure_matrix ha_import_drill
        ha_rolling_upgrade
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'true'
      # The default-feature test graph again; see postgres-foundation-pg.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: postgres-foundation
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build every release-gate suite and the gateway it spawns
        shell: bash
        run: |
          set -euo pipefail
          read -r -a suites <<< "${SUITES}"
          targets=()
          for suite in "${suites[@]}"; do
            targets+=(--test "${suite}")
          done
          mkdir -p target/ha-release-gate
          cargo test -p gateway --locked --no-run "${targets[@]}" \
            --message-format=json-render-diagnostics > target/ha-release-gate/build.jsonl
          python3 - "${suites[@]}" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          suites = sys.argv[1:]
          workspace = Path.cwd().resolve()
          output = workspace / "target" / "ha-release-gate"
          executables, gateway = {}, []
          for line in (output / "build.jsonl").read_text(encoding="utf-8").splitlines():
              message = json.loads(line)
              if message.get("reason") != "compiler-artifact" or not message.get("executable"):
                  continue
              target = message["target"]
              if target["kind"] == ["test"] and message["profile"]["test"]:
                  executables.setdefault(target["name"], []).append(message["executable"])
              elif target["kind"] == ["bin"] and target["name"] == "gateway":
                  gateway.append(message["executable"])
          if sorted(executables) != sorted(suites) or any(len(paths) != 1 for paths in executables.values()):
              raise SystemExit(f"expected one test executable for each of {suites}, built {executables}")
          # The suites spawn CARGO_BIN_EXE_gateway, an absolute path compiled
          # into them, so the gateway must be shipped at exactly that path and
          # the legs must unpack it under this same workspace.
          if gateway != [str(workspace / "target" / "debug" / "gateway")]:
              raise SystemExit(f"expected the gateway executable at target/debug/gateway, built {gateway}")
          for suite, (path,) in executables.items():
              shutil.copy2(path, output / suite)
          (output / "workspace").write_text(f"{workspace}\n", encoding="utf-8")
          print(json.dumps({"workspace": str(workspace), "gateway": gateway[0], "suites": executables}, indent=2))
          PY

      - name: Pack the executables for this run's legs
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ha-release-gate-binaries"
          archive="${RUNNER_TEMP}/ha-release-gate-binaries/ha-release-gate-binaries.tar.zst"
          tar --zstd -cf "${archive}" target/debug/gateway target/ha-release-gate
          echo "sha256=$(sha256sum "${archive}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          ls -l "${archive}"

      - name: Hand the executables to this run's legs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-release-gate-binaries
          path: ${{ runner.temp }}/ha-release-gate-binaries/ha-release-gate-binaries.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Issue #426: `ha_rolling_upgrade` runs a prepared release and its
  # successor side by side, two real binaries each built from its own commit
  # pinned in gateway/tests/ha/rolling-upgrade-pair.json (both are in this
  # checkout's history: fetch-depth 0 below). The suite verifies both commits
  # and binary hashes against its own copy of the pin, and fails rather than
  # skips without them. Only the rolling-upgrade leg unpacks this archive.
  ha-upgrade-pair:
    name: ha-upgrade-pair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      archive-sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pair's build script is replaced by an empty one (see
      # scripts/build_upgrade_pair.py), so it needs no Node.
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: ci
          node: 'false'
      # Each pinned binary is `cargo build -p gateway --bin gateway`: the
      # graph without dev-dependencies, whose dependency features differ from
      # the test graph's. admin-ui's `cargo build --locked -p gateway` is that
      # same build, so its dependency cache (keyed by its job id) is the one
      # to start from. It is only restored here, never saved: this job's
      # target directory also holds the two pinned builds.
      - name: Restore the gateway build's Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: admin-ui
          save-if: false

      - name: Build the pinned upgrade pair
        # Each pinned build has its own target directory, which no cache
        # holds, so every run compiled the whole dependency graph again
        # before the first pinned binary. Copying the restored dependency
        # artifacts into each first lets Cargo reuse every one whose version,
        # features and flags match exactly (its fingerprint decides, and
        # rebuilds anything that differs); both gateway binaries are still
        # compiled from their pinned commits, now at the same time. They are
        # copies, so no target directory can write into another.
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_build_upgrade_pair.py' -v
          if [ -d target/debug/deps ]; then
            for role in prepared successor; do
              mkdir -p "target/upgrade-pair/${role}"
              cp -a target/debug "target/upgrade-pair/${role}/"
            done
          fi
          python scripts/build_upgrade_pair.py --out "${RUNNER_TEMP}/upgrade-pair"

      - name: Pack the pair for the rolling-upgrade leg
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ha-upgrade-pair"
          archive="${RUNNER_TEMP}/ha-upgrade-pair/ha-upgrade-pair.tar.zst"
          tar --zstd -cf "${archive}" -C "${RUNNER_TEMP}/upgrade-pair" \
            manifest.json evidence prepared successor
          echo "sha256=$(sha256sum "${archive}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          ls -l "${archive}"

      - name: Hand the pair to the rolling-upgrade leg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-upgrade-pair
          path: ${{ runner.temp }}/ha-upgrade-pair/ha-upgrade-pair.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ha-release-gate:
    name: ha-release-gate (${{ matrix.suite }})
    needs:
      - ha-release-gate-build
      - ha-upgrade-pair
    # Runs, and fails in its unpack step, when a producer it uses did not
    # succeed: skipping instead would report this required check as passing.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # 25 minutes is the gate's own budget; the legs build nothing.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite:
          - ha_smoke
          - ha_security_two_replica
          - ha_events_discovery_leader
          - ha_saturation
          - ha_secret_leak
          - ha_failure_matrix
          - ha_import_drill
          - ha_rolling_upgrade
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: greengateway_ci
          POSTGRES_DB: greengateway_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greengateway_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `ha_rolling_upgrade` carries a tripwire that reads the newest
          # previous `v*` tag's own `gateway/Cargo.toml` (excluding HEAD)
          # and fails once a
          # released binary declares the PostgreSQL dependency -- the moment
          # a mixed-version cluster of released binaries becomes buildable
          # and the pinned pair's tag substitution expires.
          # `actions/checkout@v4` fetches no tags at its default depth, so
          # without this the tripwire takes its (loud) skip path and the
          # substitution never expires.
          fetch-depth: 0

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'

      - name: Write the test DSN file
        # The harness connects as this role to CREATE DATABASE and CREATE
        # ROLE per test, and hands its replicas a DSN for the disposable
        # role it made. Trust auth means no password anywhere for gitleaks
        # to flag.
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pg"
          printf 'postgres://greengateway_ci@127.0.0.1:5432/greengateway_ci\n' \
            > "${RUNNER_TEMP}/pg/database-url"
          chmod 0600 "${RUNNER_TEMP}/pg/database-url"

      - name: Check the locator resolves before trusting a pass
        # The `0 passed` check below is necessary and no longer sufficient.
        # Two suites carry always-on tests that need no database --
        # `ha_rolling_upgrade`'s release-tag tripwire and `ha_performance`'s
        # documentation gate -- so a locator that failed to resolve would
        # leave them reporting "7 passed" and "1 passed" rather than "0
        # passed", and the gate would go green having exercised nothing.
        # The locator is therefore asserted directly, here, where a failure
        # names the cause instead of hiding behind a count.
        env:
          GATEWAY_TEST_POSTGRES_URL_FILE: ${{ runner.temp }}/pg/database-url
        run: |
          set -euo pipefail
          test -s "${GATEWAY_TEST_POSTGRES_URL_FILE}"
          PG_CONTAINER="$(docker ps --filter 'name=postgres' --format '{{.Names}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" pg_isready -U greengateway_ci -d greengateway_ci

      - name: Unpack this run's release-gate executables
        uses: ./.github/actions/run-binaries
        with:
          producer: ha-release-gate-build
          producer-result: ${{ needs.ha-release-gate-build.result }}
          archive: ha-release-gate-binaries
          sha256: ${{ needs.ha-release-gate-build.outputs.archive-sha256 }}
          destination: ${{ github.workspace }}

      - name: Unpack the pinned upgrade pair
        # The manifest records both binaries' commits and hashes; the suite
        # checks both against its own copy of the pin.
        if: ${{ matrix.suite == 'ha_rolling_upgrade' }}
        uses: ./.github/actions/run-binaries
        with:
          producer: ha-upgrade-pair
          producer-result: ${{ needs.ha-upgrade-pair.result }}
          archive: ha-upgrade-pair
          sha256: ${{ needs.ha-upgrade-pair.outputs.archive-sha256 }}
          destination: ${{ runner.temp }}/upgrade-pair

      - name: Run the release-gate suite
        env:
          GATEWAY_TEST_POSTGRES_URL_FILE: ${{ runner.temp }}/pg/database-url
          GATEWAY_TEST_HA_GATE: "1"
          # Read only by `ha_rolling_upgrade`; the other suites ignore it.
          GATEWAY_TEST_UPGRADE_PAIR_DIR: ${{ runner.temp }}/upgrade-pair
          RUST_BACKTRACE: "1"
          SUITE: ${{ matrix.suite }}
        # The failure this gate is most exposed to is a suite that SKIPPED:
        # a mistyped variable, a locator that did not resolve, a missing
        # `GATEWAY_TEST_HA_GATE`. Each test's skip path returns normally, so
        # a fully skipped suite reports its whole pass count -- "12 passed"
        # -- and is indistinguishable from a suite that passed on the count
        # alone. What separates them is the clock: a skipped suite finishes
        # in 0.0Xs and the cheapest real one takes tens of seconds, because
        # every one of them starts two gateway processes and a database. So
        # the count check stays (it catches an empty target) and the elapsed
        # time is what actually guards the gate.
        run: |
          set -euo pipefail
          # The executables name paths under the producer's workspace (the
          # gateway they spawn, the repository they read), so they run only
          # from that same path.
          producer_workspace="$(cat target/ha-release-gate/workspace)"
          if [ "${producer_workspace}" != "${GITHUB_WORKSPACE}" ]; then
            echo "::error::the executables were built under ${producer_workspace}, not ${GITHUB_WORKSPACE}"
            exit 1
          fi
          test -x target/debug/gateway
          # Each case launches its own cluster against this runner's PostgreSQL.
          # Serialize cases; concurrency and availability thresholds within each
          # cluster exercise remain unchanged. The suite runs from the package
          # directory, as the test harness has always run it.
          (cd gateway && "../target/ha-release-gate/${SUITE}" --test-threads=1) 2>&1 | tee gate.log
          if grep -q 'test result: ok. 0 passed' gate.log; then
            echo "::error::${{ matrix.suite }} ran no tests; the gate would be vacuous"
            exit 1
          fi
          elapsed="$(sed -n 's/^test result:.*finished in \([0-9.]*\)s.*/\1/p' gate.log | tail -n 1)"
          if [ -z "${elapsed}" ]; then
            echo "::error::${{ matrix.suite }} printed no test-result line; the run did not complete"
            exit 1
          fi
          if awk -v e="${elapsed}" 'BEGIN { exit (e < 1.0) ? 0 : 1 }'; then
            echo "::error::${{ matrix.suite }} finished in ${elapsed}s, which is the silent-skip path, not a run. Check GATEWAY_TEST_POSTGRES_URL_FILE and GATEWAY_TEST_HA_GATE."
            exit 1
          fi
          echo "${{ matrix.suite }} did real work: ${elapsed}s"

      - name: Verify the upgrade-pair evidence against the published matrix
        # Issue #426 PR 4. A pair row writes its evidence only after every
        # one of its assertions passed, so evidence that is missing means a
        # row that failed, or was removed, renamed or ignored -- which the
        # pass count and the elapsed-time floor above cannot see while the
        # other rows still run. This refuses that, a pin that
        # docs/deployment/upgrade-support-matrix.json does not list, and any
        # observation the matrix does not publish, then writes summary.json.
        # Its own tests run first, so a broken check cannot pass the leg.
        if: ${{ matrix.suite == 'ha_rolling_upgrade' }}
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_upgrade_pair_evidence.py' -v
          python scripts/upgrade_pair_evidence.py --pair-dir "${RUNNER_TEMP}/upgrade-pair" --gate-commit "${GITHUB_SHA}"

      - name: Retain the upgrade-pair evidence
        # Both binaries' commits and hashes, the schema state, the operation
        # matrix and the readiness each pair row observed, and the summary
        # the check above wrote once it found all of it as published.
        if: ${{ always() && matrix.suite == 'ha_rolling_upgrade' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-rolling-upgrade-pair-evidence
          path: |
            ${{ runner.temp }}/upgrade-pair/manifest.json
            ${{ runner.temp }}/upgrade-pair/evidence
            ${{ runner.temp }}/upgrade-pair/summary.json
          if-no-files-found: warn
          retention-days: 30

  connections-acceptance:
    name: connections-acceptance
    needs:
      - egress-only
      - fmt
      - clippy
      - test
      - admin-ui
      - cloudflare
      - npm-policy-windows
      - dev-traffic-smoke
      - audit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'true'
      - name: Run Issue 240 acceptance gate
        if: ${{ always() }}
        shell: bash
        env:
          EGRESS_ONLY_RESULT: ${{ needs.egress-only.result }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ADMIN_UI_RESULT: ${{ needs.admin-ui.result }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare.result }}
          NPM_POLICY_WINDOWS_RESULT: ${{ needs.npm-policy-windows.result }}
          DEV_TRAFFIC_SMOKE_RESULT: ${{ needs.dev-traffic-smoke.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set +e

          node scripts/check-issue-240-acceptance.mjs
          acceptance_status=$?

          dependency_status=0
          names=(egress-only fmt clippy test admin-ui cloudflare npm-policy-windows dev-traffic-smoke audit)
          results=(
            "$EGRESS_ONLY_RESULT"
            "$FMT_RESULT"
            "$CLIPPY_RESULT"
            "$TEST_RESULT"
            "$ADMIN_UI_RESULT"
            "$CLOUDFLARE_RESULT"
            "$NPM_POLICY_WINDOWS_RESULT"
            "$DEV_TRAFFIC_SMOKE_RESULT"
            "$AUDIT_RESULT"
          )

          for index in "${!names[@]}"; do
            if [ "${results[$index]}" != "success" ]; then
              echo "::error::${names[$index]} completed with result ${results[$index]}"
              dependency_status=1
            fi
          done

          if [ "$acceptance_status" -ne 0 ] || [ "$dependency_status" -ne 0 ]; then
            exit 1
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Install gitleaks
        env:
          # Pinned to the published release asset. This binary is installed to a
          # root-owned path and then run over the full repository history, so a
          # swapped asset would execute as root in CI. TLS authenticates the
          # host, not the artifact; the digest is what ties this job to the
          # exact bytes that were reviewed. Update both together when bumping.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --proto '=https' --tlsv1.2             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"             -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --no-git=false --verbose --redact

  image-publication:
    name: image-publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Install workflow test parser
        run: python -m pip install PyYAML==6.0.3
      - name: Verify publication gates and promotion behavior
        run: |
          python -m unittest discover -s scripts -p 'test_image_publication.py' -v
          python -m unittest discover -s scripts -p 'test_candidate_scan.py' -v
          python -m unittest discover -s scripts -p 'test_image_evidence.py' -v

  # Scans the PR's image, which gateway-image built without publishing.
  image-preview:
    name: Build image
    needs: gateway-image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Load the PR image built without publishing
        uses: ./.github/actions/gateway-image
        with:
          producer-result: ${{ needs.gateway-image.result }}
          image-id: ${{ needs.gateway-image.outputs.image-id }}
          tag: greengateway:preview
      - name: Verify runtime compatibility and scan the PR image
        run: python scripts/check-runtime-image.py --image greengateway:preview --scan-preview
      - name: Preserve preview runtime and scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-runtime
          path: target/runtime-check/
          if-no-files-found: error

  image-candidate:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml


  image-scan:
    name: Scan immutable candidate
    needs: image-candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.scan.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan exact runtime manifests and enforce policy
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_DIGEST: ${{ needs.image-candidate.outputs.digest }}
        run: python scripts/scan_candidate_image.py
      - name: Exercise the exact scanned runtime
        env:
          CANDIDATE_DIGEST: ${{ needs.image-candidate.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}@${CANDIDATE_DIGEST}"
          docker pull "$image"
          python scripts/check-runtime-image.py --image "$image" --output target/image-scan/runtime
      - name: Preserve raw findings and gate decision
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-${{ github.sha }}
          path: target/image-scan/
          if-no-files-found: error
          retention-days: 30

  image-verification:
    name: Verify candidate provenance and SBOM
    needs: image-candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download this run's SBOM and bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-evidence-${{ github.sha }}
          path: target/image-evidence/
      - name: Independently verify registry attestations and downloaded SBOM
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_DIGEST: ${{ needs.image-candidate.outputs.digest }}
        run: python scripts/image_evidence.py verify
      - name: Preserve verifier results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-verification-${{ github.sha }}
          path: target/image-verification/
          if-no-files-found: error
          retention-days: 90

  production-compiler:
    name: production-compiler
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-tools
        with:
          rust: production
          node: 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  promote-image:
    name: Promote checked image
    # Every validation job is a dependency. The structural test above fails
    # when a new check is added without also adding it to this list.
    needs:
      - microbench
      - production-compiler
      - security-corpus
      - security-coverage
      - supply-chain
      - operational-alerts
      - cargo-policy
      - egress-only
      - fmt
      - clippy
      - test
      - ggctl
      - postgres-foundation-pg
      - postgres-foundation-no-default
      - postgres-foundation-lint
      - postgres-foundation
      - admin-ui
      - cloudflare
      - npm-policy-windows
      - dev-traffic-smoke
      - audit
      - gateway-image
      - ha-compose-example
      - ha-release-gate-build
      - ha-upgrade-pair
      - ha-release-gate
      - connections-acceptance
      - gitleaks
      - image-publication
      - image-candidate
      - image-scan
      - image-verification
    if: ${{ github.event_name == 'push' && success() && !contains(needs.*.result, 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Serialize promotions. The script rejects a run superseded at its ref
    # check; GitHub refs and registry tags cannot be updated atomically.
    concurrency:
      group: image-promotion-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout checked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned build tools
        uses: ./.github/actions/build-tools
        with:
          rust: none
          node: 'false'
      - name: Set up verified Buildx and pinned BuildKit
        uses: ./.github/actions/buildx
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the candidate digest without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_DIGEST: ${{ needs.image-candidate.outputs.digest }}
          VERIFIED_DIGEST: ${{ needs.image-verification.outputs.digest }}
          SCANNED_DIGEST: ${{ needs.image-scan.outputs.digest }}
        run: python scripts/promote_image.py
