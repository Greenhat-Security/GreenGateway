name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  egress-only:
    name: egress-only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce egress-only outbound HTTP
        run: bash scripts/check-egress-only.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --workspace -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  # PostgreSQL foundation (issue #241, PR 3): the gateway suite against a real
  # PostgreSQL 16 service container, in both feature states.
  #
  # The test DSN uses the documented `loopback-dev` TLS exception because the
  # GitHub-hosted service container is reachable only over loopback plaintext
  # -- exactly the shape the exception exists for. Full verified-TLS coverage
  # (server certificate + hostname verification against a configured CA) is
  # exercised in the TLS-focused suites of later #241 PRs, which bring up
  # their own TLS-capable database rather than sharing this one.
  #
  # `POSTGRES_HOST_AUTH_METHOD: trust` means the CI DSN carries no password:
  # there is no secret to leak and nothing for gitleaks to flag. The
  # disposable database is recreated per run.
  postgres-foundation:
    name: postgres-foundation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: greengateway_ci
          POSTGRES_DB: greengateway_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greengateway_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Write the test DSN file
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/pg"
          printf 'postgres://greengateway_ci@127.0.0.1:5432/greengateway_ci\n' \
            > "${RUNNER_TEMP}/pg/database-url"
          chmod 0600 "${RUNNER_TEMP}/pg/database-url"

      - name: Test against a real PostgreSQL (feature on)
        env:
          GATEWAY_TEST_POSTGRES_URL_FILE: ${{ runner.temp }}/pg/database-url
        run: cargo test -p gateway

      - name: Test without the postgres feature
        run: cargo test -p gateway --no-default-features --bin gateway

      - name: Lint without the postgres feature
        run: cargo clippy -p gateway --no-default-features --all-targets -- -D warnings

  admin-ui:
    name: admin-ui
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install admin UI dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Test admin UI
        working-directory: admin-ui
        run: npm test

      - name: Build admin UI
        working-directory: admin-ui
        run: npm run build

      - name: Install Chromium
        working-directory: admin-ui
        run: npx playwright install --with-deps chromium

      - name: Test live Connection admin UI
        working-directory: admin-ui
        run: npx playwright test --config playwright.issue240.config.ts

      - name: Test admin UI screenshots
        working-directory: admin-ui
        run: npm run screenshots

      - name: Retain admin UI test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-test-artifacts
          path: |
            admin-ui/.screenshots/
            admin-ui/playwright-report/
            admin-ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Cloudflare wrapper dependencies
        run: npm ci --ignore-scripts

      - name: Test Cloudflare wrapper
        run: npm test

      - name: Type-check Cloudflare wrapper
        run: npm run typecheck

  dev-traffic-smoke:
    name: dev-traffic-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run dev traffic smoke test
        shell: bash
        run: |
          set -eu

          compose_files=(-f docker-compose.yml -f docker-compose.dev.yml)
          trap 'docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v || true' EXIT

          docker compose "${compose_files[@]}" up -d --build

          healthy=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            docker compose "${compose_files[@]}" logs gateway dev-jwks dev-echo-a dev-echo-b dev-echo-c
            exit 1
          fi

          set +e
          node scripts/generate-traffic.mjs --smoke-test
          smoke_status=$?
          if [ "$smoke_status" -eq 0 ]; then
            node scripts/verify-dev-pool.mjs healthy
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            node scripts/proxy-load.mjs \
              --path /__dev-stream \
              --method POST \
              --body-bytes 1048576 \
              --response-bytes 128 \
              --concurrency 1 \
              --requests 3 \
              --output artifacts/proxy-load/ci-stream.json
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            docker compose "${compose_files[@]}" stop dev-echo-b
            node scripts/verify-dev-pool.mjs degraded --endpoint dev-echo-b
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            docker compose "${compose_files[@]}" start dev-echo-b
            node scripts/verify-dev-pool.mjs recovered --endpoint dev-echo-b
            smoke_status=$?
          fi
          if [ "$smoke_status" -eq 0 ]; then
            docker compose "${compose_files[@]}" stop dev-echo-a dev-echo-b dev-echo-c
            node scripts/verify-dev-pool.mjs unavailable
            smoke_status=$?
          fi
          set -e

          if [ "$smoke_status" -ne 0 ]; then
            docker compose "${compose_files[@]}" logs gateway dev-jwks dev-echo-a dev-echo-b dev-echo-c
          fi

          exit "$smoke_status"

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  connections-acceptance:
    name: connections-acceptance
    needs:
      - egress-only
      - fmt
      - clippy
      - test
      - admin-ui
      - cloudflare
      - dev-traffic-smoke
      - audit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Issue 240 acceptance gate
        if: ${{ always() }}
        shell: bash
        env:
          EGRESS_ONLY_RESULT: ${{ needs.egress-only.result }}
          FMT_RESULT: ${{ needs.fmt.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TEST_RESULT: ${{ needs.test.result }}
          ADMIN_UI_RESULT: ${{ needs.admin-ui.result }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare.result }}
          DEV_TRAFFIC_SMOKE_RESULT: ${{ needs.dev-traffic-smoke.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          set +e

          node scripts/check-issue-240-acceptance.mjs
          acceptance_status=$?

          dependency_status=0
          names=(egress-only fmt clippy test admin-ui cloudflare dev-traffic-smoke audit)
          results=(
            "$EGRESS_ONLY_RESULT"
            "$FMT_RESULT"
            "$CLIPPY_RESULT"
            "$TEST_RESULT"
            "$ADMIN_UI_RESULT"
            "$CLOUDFLARE_RESULT"
            "$DEV_TRAFFIC_SMOKE_RESULT"
            "$AUDIT_RESULT"
          )

          for index in "${!names[@]}"; do
            if [ "${results[$index]}" != "success" ]; then
              echo "::error::${names[$index]} completed with result ${results[$index]}"
              dependency_status=1
            fi
          done

          if [ "$acceptance_status" -ne 0 ] || [ "$dependency_status" -ne 0 ]; then
            exit 1
          fi
