openapi: 3.0.3
info:
  title: Golden core API
  version: 1.0.0
servers:
  - url: https://api.example.test/v1
components:
  parameters:
    WidgetId:
      in: path
      name: widgetId
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9-]+$"
    PageSize:
      in: query
      name: pageSize
      schema:
        $ref: '#/components/schemas/PageSize'
  requestBodies:
    WidgetPatch:
      required: true
      content:
        application/merge-patch+json:
          schema:
            $ref: '#/components/schemas/WidgetPatch'
  responses:
    WidgetResponse:
      description: One widget
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Widget'
  schemas:
    PageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    Audit:
      type: object
      required: [createdBy]
      properties:
        createdBy:
          type: string
        note:
          type: string
          nullable: true
    Widget:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        owner:
          $ref: '#/components/schemas/Owner'
    Owner:
      type: object
      properties:
        login:
          type: string
        kind:
          type: string
          enum: [user, team]
    WidgetCreate:
      allOf:
        - $ref: '#/components/schemas/Audit'
        - type: object
          required: [name]
          properties:
            name:
              type: string
              maxLength: 64
            quantity:
              type: integer
              format: int32
              minimum: 1
            dimensions:
              type: object
              additionalProperties:
                type: number
    WidgetPatch:
      type: object
      properties:
        name:
          type: string
        archived:
          type: boolean
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: "  List widgets  "
      tags: [widgets]
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: status
          required: true
          schema:
            type: array
            items:
              type: string
              enum: [active, archived]
          style: form
          explode: false
        - in: header
          name: X-Request-Id
          required: true
          schema:
            type: string
        - in: cookie
          name: session
          schema:
            type: string
      responses:
        "200":
          description: Widgets
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Widget'
                  next:
                    type: string
            text/csv:
              schema:
                type: string
        default:
          description: Error
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  title:
                    type: string
    post:
      operationId: createWidget
      description: Creates a widget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetCreate'
          application/xml:
            schema:
              type: object
      responses:
        "201":
          $ref: '#/components/responses/WidgetResponse'
        2XX:
          description: Accepted variant
          content:
            application/vnd.widget+json:
              schema:
                type: object
                properties:
                  queued:
                    type: boolean
  /widgets/{widgetId}:
    parameters:
      - $ref: '#/components/parameters/WidgetId'
      - in: query
        name: expand
        schema:
          type: boolean
    get:
      operationId: getWidget
      parameters:
        - in: query
          name: expand
          required: true
          schema:
            type: string
            enum: [owner, none]
      responses:
        "200":
          $ref: '#/components/responses/WidgetResponse'
    patch:
      operationId: patchWidget
      requestBody:
        $ref: '#/components/requestBodies/WidgetPatch'
      responses:
        "200":
          $ref: '#/components/responses/WidgetResponse'
    put:
      operationId: replaceWidget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                widgetId:
                  type: string
                name:
                  type: string
    delete:
      operationId: "delete widget!"
      description: "   "
    head: {}
    options:
      operationId: getWidget
    trace:
      operationId: traceWidget
  /widgets/{widgetId}/photo:
    post:
      operationId: uploadWidgetPhoto
      summary: Upload a widget photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
  /widgets/{widgetId}/labels:
    put:
      operationId: replaceWidgetLabels
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
  /forms/contact:
    post:
      operationId: submitContactForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                message:
                  type: string
  /search:
    get:
      summary: Search everything
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
  /reports/{year}/{month}:
    get:
      operationId: getReport
      parameters:
        - in: path
          name: year
          required: true
          schema:
            type: integer
