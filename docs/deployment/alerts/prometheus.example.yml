# Local wiring example, not a production network or alert delivery configuration.
# See ../operational-alerts.md before deploying. Keep /metrics privately routed.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - greengateway.rules.yml
  - targets.example.rules.yml
scrape_configs:
  - job_name: greengateway
    honor_labels: false
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels:
          instance: gateway-1
          deployment_mode: standalone
    # Deliberately allow only operator-owned scrape labels. Do not add request
    # identities, destinations, credentials, or discovery metadata as labels.
    relabel_configs:
      - action: labelkeep
        regex: '__.*|job|instance|deployment_mode'
