        values: '0+0x40'
      - series: 'greengateway_audit_queue_capacity{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '100+0x40'
      - series: 'greengateway_audit_queue_oldest_age_seconds{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '0+0x40'
      - series: 'greengateway_database_pool_size{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '10+0x40'
      - series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '10+0x40'
      - series: 'greengateway_database_pool_waiting{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '0+0x40'
      - series: 'greengateway_schema_compatible{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '1+0x40'
      - series: 'greengateway_cluster_heartbeat_age_seconds{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '0+0x40'
      - series: 'greengateway_cluster_config_mismatch{job="greengateway",instance="gateway-4",deployment_mode="cluster"}'
        values: '0+0x40'
    alert_rule_test:
      - {eval_time: 1m30s, alertname: GreenGatewayClusterMetricsMissing, exp_alerts: []}
      - eval_time: 2m
        alertname: GreenGatewayClusterMetricsMissing
        exp_alerts:
          - &fires_cluster_metrics_missing_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: &annotations_cluster_metrics_missing
              summary: 'Cluster gateway scrape is missing database pool gauges'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability'
          - &fires_cluster_metrics_missing_gateway_2_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-2', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: *annotations_cluster_metrics_missing
          - &fires_cluster_metrics_missing_gateway_3_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-3', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: *annotations_cluster_metrics_missing
      - {eval_time: 4m, alertname: GreenGatewayClusterMetricsMissing, exp_alerts: []}
      - {eval_time: 3m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}

  - name: 'required gauge becomes stale on one successfully scraped replica'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - series: 'greengateway_audit_queue_capacity{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '100+0x4 stale _x10 100+0x24'
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - *series_available_gateway_1_cluster
      - *series_waiting_gateway_1_cluster
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_expected_gateway_2_cluster
      - *series_ready_gateway_2_cluster
      - *series_draining_gateway_2_cluster
      - *series_depth_gateway_2_cluster
      - *series_capacity_gateway_2_cluster
      - *series_oldest_gateway_2_cluster
      - *series_size_gateway_2_cluster
      - *series_available_gateway_2_cluster
      - *series_waiting_gateway_2_cluster
      - *series_schema_gateway_2_cluster
      - *series_heartbeat_gateway_2_cluster
      - *series_mismatch_gateway_2_cluster
    alert_rule_test:
      - {eval_time: 4m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - eval_time: 4m30s
        alertname: GreenGatewayMetricsMissing
        exp_alerts:
          - &fires_metrics_missing_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: *annotations_metrics_missing
      - {eval_time: 8m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - {eval_time: 7m30s, alertname: GreenGatewayMetricsTargetDown, exp_alerts: []}

  - name: 'pool waiting and exhaustion must occur on the same instance'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - *series_waiting_gateway_1_cluster_3
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_expected_gateway_2_cluster
      - *series_ready_gateway_2_cluster
      - *series_draining_gateway_2_cluster
      - *series_depth_gateway_2_cluster
      - *series_capacity_gateway_2_cluster
      - *series_oldest_gateway_2_cluster
      - *series_size_gateway_2_cluster
      - series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - *series_waiting_gateway_2_cluster
      - *series_schema_gateway_2_cluster
      - *series_heartbeat_gateway_2_cluster
      - *series_mismatch_gateway_2_cluster
    alert_rule_test:
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}

  - name: 'counter reset without any new failures must not fire'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - *series_available_gateway_1_cluster
      - *series_waiting_gateway_1_cluster
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="sink_error"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",outcome="failure"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_authority_event_capacity_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_authority_event_evidence_failures_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_audit_durability_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="store"}'
        values: '10+0x5 0+0x34'
    alert_rule_test:
      - {eval_time: 2m30s, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}

  # Reset at 3m is healthy; first post-reset increase at 3m30s starts the 2m hold.
  - name: 'new failures after a counter reset still fire and later recover'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - *series_available_gateway_1_cluster
      - *series_waiting_gateway_1_cluster
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="sink_error"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",outcome="failure"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_authority_event_capacity_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_authority_event_evidence_failures_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_audit_durability_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="store"}'
        values: '10+0x5 0+1x14 14+0x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 8m, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 8m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 8m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - eval_time: 5m30s
        alertname: GreenGatewayAuthorityEventCapacityRefusals
        exp_alerts:
          - &fires_authority_event_capacity_refusals_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'Authority changes were refused because the authority-event journal is full'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal'
      - {eval_time: 8m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: [*fires_authority_event_capacity_refusals_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - eval_time: 5m30s
        alertname: GreenGatewayAuthorityEvidenceWriteFailures
        exp_alerts:
          - &fires_authority_evidence_write_failures_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'Authority changes were refused because their required evidence could not be written'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-evidence-failures'
      - {eval_time: 8m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: [*fires_authority_evidence_write_failures_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - eval_time: 5m30s
        alertname: GreenGatewayAuditDurabilityRefusals
        exp_alerts:
          - &fires_audit_durability_refusals_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: *annotations_audit_durability_refusals
      - {eval_time: 8m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: [*fires_audit_durability_refusals_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}

  # Authority-event journal rules (issue #440 PR 4). gateway-1 leads maintenance
  # and so publishes the journal gauges; gateway-2 leads the dispatcher.
  - name: 'authority-event journal healthy with a dispatcher; refusal and failure counters absent'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - &series_maintenance_leader_gateway_1_cluster
        series: 'greengateway_cluster_maintenance_leader{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - &series_maintenance_follower_gateway_2_cluster
        series: 'greengateway_cluster_maintenance_leader{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_retention_success_gateway_1_cluster
        series: 'greengateway_leader_task_last_success_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster",task="authority_event_retention"}'
        values: '30+0x40'
      - &series_journal_retained_gateway_1_cluster
        series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '100+0x40'
      - &series_journal_capacity_gateway_1_cluster
        series: 'greengateway_authority_event_journal_capacity{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1000+0x40'
      - &series_journal_oldest_gateway_1_cluster
        series: 'greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - series: 'greengateway_authority_event_undelivered{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - &series_dispatcher_lease_gateway_2_cluster
        series: 'greengateway_cluster_lease_age_seconds{job="greengateway",instance="gateway-2",deployment_mode="cluster",scope="authority_event_dispatcher"}'
        values: '15+30x40'
      - series: 'greengateway_authority_event_delivered_total{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+5x40'
    alert_rule_test:
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}
      - {eval_time: 1m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}

  # gateway-1 crosses 80% at 2m and reaches capacity at 8m; retention frees room at 13m.
  # gateway-2 once led maintenance and still exports a full journal it no longer observes.
  - name: 'journal filling and full fire from the maintenance leader only and recover'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_maintenance_leader_gateway_1_cluster
      - *series_maintenance_follower_gateway_2_cluster
      - *series_retention_success_gateway_1_cluster
      - series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '100+0x3 850+0x11 1000+0x9 100+0x15'
      - *series_journal_capacity_gateway_1_cluster
      - *series_journal_oldest_gateway_1_cluster
      - series: 'greengateway_leader_task_last_success_age_seconds{job="greengateway",instance="gateway-2",deployment_mode="cluster",task="authority_event_retention"}'
        values: '30+0x40'
      - series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '1000+0x40'
      - series: 'greengateway_authority_event_journal_capacity{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '1000+0x40'
      - *series_dispatcher_lease_gateway_2_cluster
    alert_rule_test:
      - {eval_time: 1m30s, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 8m30s, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - eval_time: 9m
        alertname: GreenGatewayAuthorityEventJournalFull
        exp_alerts:
          - &fires_authority_event_journal_full_cluster
            exp_labels: {job: 'greengateway', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'Authority-event journal is at capacity and will refuse authority changes'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal'
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: [*fires_authority_event_journal_full_cluster]}
      - {eval_time: 14m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 6m30s, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - eval_time: 7m
        alertname: GreenGatewayAuthorityEventJournalFilling
        exp_alerts:
          - &fires_authority_event_journal_filling_cluster
            exp_labels: {job: 'greengateway', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'Authority-event journal retains more than 80 percent of its capacity'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal'
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: [*fires_authority_event_journal_filling_cluster]}
      - {eval_time: 14m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}

  # The retention step's last success ages past the 300s gate at 4m30s, so the
  # leader's frozen zero age is reported as unobserved instead of healthy. Retained
  # rows only fall through retention, so its 90% reading still counts.
  - name: 'stalled retention makes the journal unobserved but cannot hide a filling journal'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_maintenance_leader_gateway_1_cluster
      - *series_maintenance_follower_gateway_2_cluster
      - series: 'greengateway_leader_task_last_success_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster",task="authority_event_retention"}'
        values: '30+30x40'
      - series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '900+0x40'
      - *series_journal_capacity_gateway_1_cluster
      - *series_journal_oldest_gateway_1_cluster
      - *series_dispatcher_lease_gateway_2_cluster
    alert_rule_test:
      - {eval_time: 14m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - eval_time: 14m30s
        alertname: GreenGatewayAuthorityEventJournalUnobserved
        exp_alerts:
          - &fires_authority_event_journal_unobserved_cluster
            exp_labels: {job: 'greengateway', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'No replica is publishing fresh authority-event journal gauges'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal'
      - {eval_time: 20m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: [*fires_authority_event_journal_unobserved_cluster]}
      - {eval_time: 4m30s, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: [*fires_authority_event_journal_filling_cluster]}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: [*fires_authority_event_journal_filling_cluster]}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}

  # The oldest undelivered event waits 600s from 2m to 9m30s, then the sink catches up.
  - name: 'delivery lag fires after its hold while a dispatcher runs and recovers'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_maintenance_leader_gateway_1_cluster
      - *series_maintenance_follower_gateway_2_cluster
      - *series_retention_success_gateway_1_cluster
      - *series_journal_retained_gateway_1_cluster
      - *series_journal_capacity_gateway_1_cluster
      - series: 'greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x3 600+0x15 0+0x21'
      - *series_dispatcher_lease_gateway_2_cluster
    alert_rule_test:
      - {eval_time: 6m30s, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - eval_time: 7m
        alertname: GreenGatewayAuthorityEventDeliveryLag
        exp_alerts:
          - &fires_authority_event_delivery_lag_cluster
            exp_labels: {job: 'greengateway', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'Committed authority events are waiting for delivery'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-delivery'
      - {eval_time: 9m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: [*fires_authority_event_delivery_lag_cluster]}
      - {eval_time: 11m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - {eval_time: 9m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}

  # No dispatcher lease series and no dispatcher failure series anywhere: no sink.
  - name: 'without a sink every retained event is undelivered by design and delivery is not judged'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_maintenance_leader_gateway_1_cluster
      - *series_maintenance_follower_gateway_2_cluster
      - *series_retention_success_gateway_1_cluster
      - *series_journal_retained_gateway_1_cluster
      - *series_journal_capacity_gateway_1_cluster
      - series: 'greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '86400+30x40'
      - series: 'greengateway_authority_event_undelivered{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '100+0x40'
    alert_rule_test:
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}

  # gateway-2's dispatcher never wins its lease (failing until 12m), so no replica
  # exports the dispatcher's lease age; its failure series still marks a configured
  # sink. gateway-1's fenced steps are handovers and never count as failures.
  - name: 'a dispatcher that cannot take its lease fails sustainedly and keeps lag judged'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_maintenance_leader_gateway_1_cluster
      - *series_maintenance_follower_gateway_2_cluster
      - *series_retention_success_gateway_1_cluster
      - *series_journal_retained_gateway_1_cluster
      - *series_journal_capacity_gateway_1_cluster
      - series: 'greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '600+0x40'
      - series: 'greengateway_authority_event_delivery_failures_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",kind="fenced"}'
        values: '0+1x40'
      - series: 'greengateway_authority_event_delivery_failures_total{job="greengateway",instance="gateway-2",deployment_mode="cluster",kind="lease_acquire"}'
        values: '0+1x24 24+0x15'
    alert_rule_test:
      - {eval_time: 4m30s, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: [*fires_authority_event_delivery_lag_cluster]}
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryLag, exp_alerts: [*fires_authority_event_delivery_lag_cluster]}
      - {eval_time: 10m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}
      - eval_time: 10m30s
        alertname: GreenGatewayAuthorityEventDeliveryFailures
        exp_alerts:
          - &fires_authority_event_delivery_failures_gateway_2_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-2', deployment_mode: 'cluster', severity: 'warning', owner: 'gateway-operations'}
            exp_annotations:
              summary: 'Authority-event dispatcher steps keep failing'
              runbook_url: 'https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-delivery'
      - {eval_time: 15m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: [*fires_authority_event_delivery_failures_gateway_2_cluster]}
      - {eval_time: 18m, alertname: GreenGatewayAuthorityEventDeliveryFailures, exp_alerts: []}

  # The leader scrapes successfully but its journal gauges are absent until 12m.
  - name: 'missing journal gauges on the maintenance leader are not healthy zeros'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_maintenance_leader_gateway_1_cluster
      - *series_retention_success_gateway_1_cluster
      - series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '_x24 100+0x16'
      - series: 'greengateway_authority_event_journal_capacity{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '_x24 1000+0x16'
      - series: 'greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '_x24 0+0x16'
    alert_rule_test:
      - {eval_time: 9m30s, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - {eval_time: 10m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: [*fires_authority_event_journal_unobserved_cluster]}
      - {eval_time: 11m30s, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: [*fires_authority_event_journal_unobserved_cluster]}
      - {eval_time: 13m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - {eval_time: 11m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 11m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}

  # gateway-1 leads until it drains at 5m, still exporting a 95% journal; gateway-2
  # takes over at 6m and publishes its first reading.
  - name: 'maintenance handover neither alerts nor trusts the former leader'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - series: 'greengateway_cluster_maintenance_leader{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x9 0+0x30'
      - series: 'greengateway_cluster_maintenance_leader{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x11 1+0x28'
      - *series_retention_success_gateway_1_cluster
      - series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '950+0x40'
      - *series_journal_capacity_gateway_1_cluster
      - *series_journal_oldest_gateway_1_cluster
      - series: 'greengateway_leader_task_last_success_age_seconds{job="greengateway",instance="gateway-2",deployment_mode="cluster",task="authority_event_retention"}'
        values: '_x12 30+0x28'
      - series: 'greengateway_authority_event_journal_retained{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '_x12 100+0x28'
      - series: 'greengateway_authority_event_journal_capacity{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '_x12 1000+0x28'
      - series: 'greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '_x12 0+0x28'
    alert_rule_test:
      - {eval_time: 4m30s, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalFilling, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalFull, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}
      - {eval_time: 18m, alertname: GreenGatewayAuthorityEventJournalUnobserved, exp_alerts: []}

  # Refusals are consequences, not lifecycle noise: gateway-1 is draining throughout.
  - name: 'refused authority changes page per replica even while draining, then recover'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - series: 'greengateway_gateway_ready{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x40'
      - series: 'greengateway_gateway_draining{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - series: 'greengateway_authority_event_capacity_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+1x24 24+0x15'
      - series: 'greengateway_authority_event_evidence_failures_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+1x24 24+0x15'
    alert_rule_test:
      - {eval_time: 2m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: [*fires_authority_event_capacity_refusals_gateway_1_cluster]}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: [*fires_authority_event_capacity_refusals_gateway_1_cluster]}
      - {eval_time: 18m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: [*fires_authority_evidence_write_failures_gateway_1_cluster]}
      - {eval_time: 12m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: [*fires_authority_evidence_write_failures_gateway_1_cluster]}
      - {eval_time: 18m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}

  # Startup seeding (issue #440 review). The gateway exports every counter a
  # single-event rule reads at 0 from the moment its recorder is installed, so
  # one event after a restart is a 0 -> 1 increase: gateway-1 counts a single
  # event at 2m30s and pages after the 2m hold, then recovers once the window
  # holds only the 1. gateway-2 counts the same single event on a lazy series
  # that first appears at 1, which increase() cannot see, so it never pages.
  - name: 'one event on a counter seeded at zero pages; the same event on a lazy series cannot'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_ready_gateway_2_cluster
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="full"}'
        values: '0+0x4 1+0x35'
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-2",deployment_mode="cluster",reason="full"}'
        values: '_x5 1+0x35'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",outcome="failure"}'
        values: '0+0x4 1+0x35'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-2",deployment_mode="cluster",outcome="failure"}'
        values: '_x5 1+0x35'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x4 1+0x35'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '_x5 1+0x35'
      - series: 'greengateway_authority_event_capacity_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x4 1+0x35'
      - series: 'greengateway_authority_event_capacity_refusals_total{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '_x5 1+0x35'
      - series: 'greengateway_authority_event_evidence_failures_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '0+0x4 1+0x35'
      - series: 'greengateway_authority_event_evidence_failures_total{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '_x5 1+0x35'
      - series: 'greengateway_audit_durability_refusals_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="timeout"}'
        values: '0+0x4 1+0x35'
      - series: 'greengateway_audit_durability_refusals_total{job="greengateway",instance="gateway-2",deployment_mode="cluster",reason="timeout"}'
        values: '_x5 1+0x35'
    alert_rule_test:
      - {eval_time: 2m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 4m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 9m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 4m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 9m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 4m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 9m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 4m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: [*fires_authority_event_capacity_refusals_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: [*fires_authority_event_capacity_refusals_gateway_1_cluster]}
      - {eval_time: 9m, alertname: GreenGatewayAuthorityEventCapacityRefusals, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 4m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: [*fires_authority_evidence_write_failures_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: [*fires_authority_evidence_write_failures_gateway_1_cluster]}
      - {eval_time: 9m, alertname: GreenGatewayAuthorityEvidenceWriteFailures, exp_alerts: []}
      - {eval_time: 2m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 4m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
      - {eval_time: 4m30s, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: [*fires_audit_durability_refusals_gateway_1_cluster]}
      - {eval_time: 6m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: [*fires_audit_durability_refusals_gateway_1_cluster]}
      - {eval_time: 9m, alertname: GreenGatewayAuditDurabilityRefusals, exp_alerts: []}
