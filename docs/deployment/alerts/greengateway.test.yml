      - {eval_time: 4m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - eval_time: 4m30s
        alertname: GreenGatewayMetricsMissing
        exp_alerts:
          - &fires_metrics_missing_gateway_1_cluster
            exp_labels: {job: 'greengateway', instance: 'gateway-1', deployment_mode: 'cluster', severity: 'critical', owner: 'gateway-operations'}
            exp_annotations: *annotations_metrics_missing
      - {eval_time: 8m, alertname: GreenGatewayMetricsMissing, exp_alerts: []}
      - {eval_time: 7m30s, alertname: GreenGatewayMetricsTargetDown, exp_alerts: []}

  - name: 'pool waiting and exhaustion must occur on the same instance'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '1+0x40'
      - *series_waiting_gateway_1_cluster_3
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - *series_up_gateway_2_cluster
      - *series_expected_gateway_2_cluster
      - *series_ready_gateway_2_cluster
      - *series_draining_gateway_2_cluster
      - *series_depth_gateway_2_cluster
      - *series_capacity_gateway_2_cluster
      - *series_oldest_gateway_2_cluster
      - *series_size_gateway_2_cluster
      - series: 'greengateway_database_pool_available{job="greengateway",instance="gateway-2",deployment_mode="cluster"}'
        values: '0+0x40'
      - *series_waiting_gateway_2_cluster
      - *series_schema_gateway_2_cluster
      - *series_heartbeat_gateway_2_cluster
      - *series_mismatch_gateway_2_cluster
    alert_rule_test:
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolSaturated, exp_alerts: []}

  - name: 'counter reset without any new failures must not fire'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - *series_available_gateway_1_cluster
      - *series_waiting_gateway_1_cluster
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="sink_error"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",outcome="failure"}'
        values: '10+0x5 0+0x34'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+0x34'
    alert_rule_test:
      - {eval_time: 2m30s, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 2m30s, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 6m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 12m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}

  # Reset at 3m is healthy; first post-reset increase at 3m30s starts the 2m hold.
  - name: 'new failures after a counter reset still fire and later recover'
    interval: 30s
    input_series:
      - *series_up_gateway_1_cluster
      - *series_expected_gateway_1_cluster
      - *series_ready_gateway_1_cluster
      - *series_draining_gateway_1_cluster
      - *series_depth_gateway_1_cluster
      - *series_capacity_gateway_1_cluster
      - *series_oldest_gateway_1_cluster
      - *series_size_gateway_1_cluster
      - *series_available_gateway_1_cluster
      - *series_waiting_gateway_1_cluster
      - *series_schema_gateway_1_cluster
      - *series_heartbeat_gateway_1_cluster
      - *series_mismatch_gateway_1_cluster
      - series: 'audit_events_dropped_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",reason="sink_error"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_audit_flush_total{job="greengateway",instance="gateway-1",deployment_mode="cluster",outcome="failure"}'
        values: '10+0x5 0+1x14 14+0x20'
      - series: 'greengateway_database_pool_timeouts_total{job="greengateway",instance="gateway-1",deployment_mode="cluster"}'
        values: '10+0x5 0+1x14 14+0x20'
    alert_rule_test:
      - {eval_time: 5m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 8m, alertname: GreenGatewayAuditLoss, exp_alerts: [*fires_audit_loss_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuditLoss, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 8m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: [*fires_audit_flush_failures_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayAuditFlushFailures, exp_alerts: []}
      - {eval_time: 5m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
      - {eval_time: 5m30s, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 8m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: [*fires_database_pool_timeouts_gateway_1_cluster]}
      - {eval_time: 16m, alertname: GreenGatewayDatabasePoolTimeouts, exp_alerts: []}
