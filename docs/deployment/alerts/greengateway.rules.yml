# Contract v1. Starting thresholds; tune with operational-alerts.md and tests.
# Reduce alerts to operator-controlled target identity; never preserve event labels.
groups:
  - name: greengateway-operational-v1
    interval: 30s
    rules:
      - alert: GreenGatewayMetricsTargetDown
        expr: |
          max by (job, instance, deployment_mode) (
            (up{job="greengateway"} == 0)
            or (greengateway_monitoring:target_expected{job="greengateway"} == 1
                unless on (job, instance) (up{job="greengateway"} == 1))
          )
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Gateway metrics target is unavailable or missing from discovery
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability

      - alert: GreenGatewayMetricsJobMissing
        expr: absent(up{job="greengateway"})
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: No gateway scrape targets are visible
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability

      - alert: GreenGatewayExpectedTargetsMissing
        expr: absent(greengateway_monitoring:target_expected{job="greengateway"})
        for: 2m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway expected-target inventory is missing
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability

      - alert: GreenGatewayMonitoringConfigurationInvalid
        expr: |
          max by (job, instance, deployment_mode) (
            up{job="greengateway",deployment_mode!~"standalone|cluster"}
            or greengateway_monitoring:target_expected{job="greengateway",deployment_mode!~"standalone|cluster"}
            or (greengateway_monitoring:target_expected{job="greengateway"} != 1)
            or (up{job="greengateway"}
                unless on (job, instance, deployment_mode)
                  (greengateway_monitoring:target_expected{job="greengateway"} == 1))
          )
        for: 2m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway monitoring target does not match the reviewed inventory
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability

      - alert: GreenGatewayMetricsMissing
        expr: |
          max by (job, instance, deployment_mode) (up{job="greengateway"} == 1)
          unless on (job, instance) (
            greengateway_gateway_ready{job="greengateway"}
            and on (job, instance) greengateway_gateway_draining{job="greengateway"}
            and on (job, instance) greengateway_audit_queue_depth{job="greengateway"}
            and on (job, instance) greengateway_audit_queue_capacity{job="greengateway"}
            and on (job, instance) greengateway_audit_queue_oldest_age_seconds{job="greengateway"}
          )
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Successful gateway scrape is missing required gauges
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability

      - alert: GreenGatewayStartupStalled
        expr: |
          max by (job, instance, deployment_mode) (greengateway_gateway_ready{job="greengateway"} == 0)
          and on (job, instance) (greengateway_gateway_draining{job="greengateway"} == 0)
          and on (job, instance) (up{job="greengateway"} == 1)
        for: 10m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway lifecycle has remained in startup
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#lifecycle-stalls

      - alert: GreenGatewayDrainStalled
        expr: |
          max by (job, instance, deployment_mode) (greengateway_gateway_draining{job="greengateway"} == 1)
          and on (job, instance) (up{job="greengateway"} == 1)
        for: 10m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway lifecycle has remained in drain
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#lifecycle-stalls

      # Audit loss, flush failures and durability refusals are not suppressed during startup/drain.
      - alert: GreenGatewayAuditLoss
        expr: |
          sum by (job, instance, deployment_mode) (increase(audit_events_dropped_total{job="greengateway"}[5m])) > 0
          and on (job, instance) (up{job="greengateway"} == 1)
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Gateway audit events were dropped
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-delivery

      - alert: GreenGatewayAuditBacklog
        expr: |
          max by (job, instance, deployment_mode) (
            (greengateway_audit_queue_depth{job="greengateway"} / greengateway_audit_queue_capacity{job="greengateway"} > 0.8)
            or (greengateway_audit_queue_oldest_age_seconds{job="greengateway"} > 30)
          )
          and on (job, instance) (greengateway_gateway_ready{job="greengateway"} == 1)
          and on (job, instance) (up{job="greengateway"} == 1)
        for: 5m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway audit delivery backlog is sustained
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-delivery

      - alert: GreenGatewayAuditFlushFailures
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_audit_flush_total{job="greengateway",outcome="failure"}[5m])) > 0
          and on (job, instance) (up{job="greengateway"} == 1)
        for: 2m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway audit sink flushes are failing
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-delivery

      # Under AUDIT_DURABILITY=required (the default) every increase is a request
      # answered 503 because its decision record could not commit; /readyz stays 200.
      - alert: GreenGatewayAuditDurabilityRefusals
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_audit_durability_refusals_total{job="greengateway"}[5m])) > 0
          and on (job, instance) (up{job="greengateway"} == 1)
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Gateway requests were refused because their audit records could not be committed
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#audit-durability-refusals

      - alert: GreenGatewayDatabasePoolSaturated
        expr: |
          max by (job, instance, deployment_mode) (greengateway_database_pool_waiting{job="greengateway",deployment_mode="cluster"} > 0)
          and on (job, instance) (greengateway_database_pool_available{job="greengateway",deployment_mode="cluster"} == 0)
          and on (job, instance) (greengateway_gateway_ready{job="greengateway"} == 1)
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 5m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway database callers are waiting with no free pool connections
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#database-capacity

      - alert: GreenGatewayDatabasePoolTimeouts
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_database_pool_timeouts_total{job="greengateway",deployment_mode="cluster"}[5m])) > 0
          and on (job, instance) (greengateway_gateway_ready{job="greengateway"} == 1)
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 2m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway database pool acquisitions are timing out
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#database-capacity

      - alert: GreenGatewaySchemaIncompatible
        expr: |
          max by (job, instance, deployment_mode) (greengateway_schema_compatible{job="greengateway",deployment_mode="cluster"} == 0)
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 1m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Gateway observed an incompatible database schema
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority

      - alert: GreenGatewayClusterHeartbeatStale
        expr: |
          max by (job, instance, deployment_mode) (greengateway_cluster_heartbeat_age_seconds{job="greengateway",deployment_mode="cluster"} >= 30)
          and on (job, instance) (greengateway_gateway_ready{job="greengateway"} == 1)
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 1m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway membership heartbeat has reached the example stale window
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority

      - alert: GreenGatewaySecurityRevisionLag
        expr: |
          max by (job, instance, deployment_mode) (greengateway_security_revision_lag{job="greengateway",deployment_mode="cluster"} > 0)
          and on (job, instance) (greengateway_gateway_ready{job="greengateway"} == 1)
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 5m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway security revision lag is sustained
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority

      - alert: GreenGatewayClusterConfigMismatch
        expr: |
          max by (job, instance, deployment_mode) (greengateway_cluster_config_mismatch{job="greengateway",deployment_mode="cluster"} == 1)
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 5m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Gateway configuration fingerprint has not converged
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#cluster-authority

      - alert: GreenGatewayClusterMetricsMissing
        expr: |
          max by (job, instance, deployment_mode) (up{job="greengateway",deployment_mode="cluster"} == 1)
          unless on (job, instance) (
            greengateway_database_pool_size{job="greengateway",deployment_mode="cluster"}
            and on (job, instance) greengateway_database_pool_available{job="greengateway",deployment_mode="cluster"}
            and on (job, instance) greengateway_database_pool_waiting{job="greengateway",deployment_mode="cluster"}
          )
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Cluster gateway scrape is missing database pool gauges
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#metrics-availability

  # Durable authority-event evidence (issue #425 metrics, issue #440 PR 4).
  # Refusal counters page per replica: the journal's in cluster mode, the SQLite
  # stores' in standalone mode. The journal is shared state whose gauges only a
  # leader publishes and every former leader keeps at its last value, so
  # journal rules read the current maintenance leader alone, per deployment.
  - name: greengateway-authority-events-v1
    interval: 30s
    rules:
      - alert: GreenGatewayAuthorityEventCapacityRefusals
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_authority_event_capacity_refusals_total{job="greengateway",deployment_mode="cluster"}[5m])) > 0
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Authority changes were refused because the authority-event journal is full
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal

      - alert: GreenGatewayAuthorityEvidenceWriteFailures
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_authority_event_evidence_failures_total{job="greengateway",deployment_mode="cluster"}[5m])) > 0
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Authority changes were refused because their required evidence could not be written
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-evidence-failures

      # The one standalone rule here: a standalone gateway has no journal, but its
      # SQLite token and Connections stores refuse a change whose evidence row
      # cannot be inserted, and each such refusal is an authority change that did
      # not happen.
      - alert: GreenGatewayStandaloneEvidenceWriteFailures
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_standalone_evidence_failures_total{job="greengateway",deployment_mode="standalone"}[5m])) > 0
          and on (job, instance) (up{job="greengateway",deployment_mode="standalone"} == 1)
        for: 2m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Standalone authority changes were refused because their evidence could not be written
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#standalone-evidence-failures

      # Retained rows fall only through retention, so a leader whose retention is
      # failing still reports a lower bound: capacity rules need no freshness gate.
      - alert: GreenGatewayAuthorityEventJournalFull
        expr: |
          max by (job, deployment_mode) (
            (greengateway_authority_event_journal_retained{job="greengateway",deployment_mode="cluster"}
              >= greengateway_authority_event_journal_capacity{job="greengateway",deployment_mode="cluster"})
            and on (job, instance) (greengateway_cluster_maintenance_leader{job="greengateway",deployment_mode="cluster"} == 1)
            and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
          )
        for: 1m
        labels: {severity: critical, owner: gateway-operations}
        annotations:
          summary: Authority-event journal is at capacity and will refuse authority changes
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal

      - alert: GreenGatewayAuthorityEventJournalFilling
        expr: |
          max by (job, deployment_mode) (
            (greengateway_authority_event_journal_retained{job="greengateway",deployment_mode="cluster"}
              / greengateway_authority_event_journal_capacity{job="greengateway",deployment_mode="cluster"} > 0.8)
            and on (job, instance) (greengateway_cluster_maintenance_leader{job="greengateway",deployment_mode="cluster"} == 1)
            and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
          )
        for: 5m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Authority-event journal retains more than 80 percent of its capacity
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal

      # The age is trusted only from a leader whose retention step succeeded
      # recently. Without a dispatcher anywhere (no AUTHORITY_EVENT_SINK) every
      # retained event is undelivered by design, so delivery is not judged.
      - alert: GreenGatewayAuthorityEventDeliveryLag
        expr: |
          max by (job, deployment_mode) (
            (greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",deployment_mode="cluster"} > 120)
            and on (job, instance) (greengateway_cluster_maintenance_leader{job="greengateway",deployment_mode="cluster"} == 1)
            and on (job, instance) (greengateway_leader_task_last_success_age_seconds{job="greengateway",deployment_mode="cluster",task="authority_event_retention"} < 300)
            and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
          )
          and on (job, deployment_mode) (
            count by (job, deployment_mode) (
              greengateway_cluster_lease_age_seconds{job="greengateway",deployment_mode="cluster",scope="authority_event_dispatcher"}
              or greengateway_authority_event_delivery_failures_total{job="greengateway",deployment_mode="cluster"}
            )
          )
        for: 5m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Committed authority events are waiting for delivery
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-delivery

      # A fenced step is a leader handing over, not a failed delivery.
      - alert: GreenGatewayAuthorityEventDeliveryFailures
        expr: |
          sum by (job, instance, deployment_mode) (increase(greengateway_authority_event_delivery_failures_total{job="greengateway",deployment_mode="cluster",kind!="fenced"}[5m])) > 0
          and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
        for: 10m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: Authority-event dispatcher steps keep failing
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-delivery

      # Every cluster replica takes part in the maintenance election, and the
      # leader's retention step publishes the journal gauges with or without a sink.
      - alert: GreenGatewayAuthorityEventJournalUnobserved
        expr: |
          count by (job, deployment_mode) (up{job="greengateway",deployment_mode="cluster"} == 1)
          unless on (job, deployment_mode)
          count by (job, deployment_mode) (
            (greengateway_cluster_maintenance_leader{job="greengateway",deployment_mode="cluster"} == 1)
            and on (job, instance) (greengateway_leader_task_last_success_age_seconds{job="greengateway",deployment_mode="cluster",task="authority_event_retention"} < 300)
            and on (job, instance) greengateway_authority_event_journal_retained{job="greengateway",deployment_mode="cluster"}
            and on (job, instance) greengateway_authority_event_journal_capacity{job="greengateway",deployment_mode="cluster"}
            and on (job, instance) greengateway_authority_event_oldest_undelivered_age_seconds{job="greengateway",deployment_mode="cluster"}
            and on (job, instance) (up{job="greengateway",deployment_mode="cluster"} == 1)
          )
        for: 10m
        labels: {severity: warning, owner: gateway-operations}
        annotations:
          summary: No replica is publishing fresh authority-event journal gauges
          runbook_url: https://github.com/Greenhat-Security/GreenGateway/blob/main/docs/deployment/operational-alerts.md#authority-event-journal
