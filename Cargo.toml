[workspace]
members = ["gateway"]
resolver = "2"

[workspace.package]
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
arc-swap = "1.7.1"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.11.0"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
hex = "0.4.3"
hmac = "0.12.1"
futures-util = "0.3.31"
getrandom = "0.3.4"
http = "1.4.2"
# Issue #257 needs an HTTP/2 client and server that `reqwest` and `axum::serve`
# cannot provide. Depending on `hyper` DIRECTLY with `http2` is the whole point:
# feature edges are one-way (`hyper-util/http2 = ["hyper/http2"]`), so this
# enables hyper's HTTP/2 and NOT hyper-util's, which means `axum::serve` keeps
# refusing an h2 preface on the data and admin listeners.
# `scripts/check-egress-only.sh` asserts exactly that, by feature name.
hyper = { version = "1.10.1", default-features = false, features = ["client", "server", "http2"] }
# Already in the graph transitively (axum and reqwest both build on it). Naming
# it here adds a dependency edge, not a crate, and gives `TokioIo`,
# `TokioExecutor`, and `TowerToHyperService` by name. `http2` is deliberately
# NOT requested: that is the feature that would make every listener serve h2c.
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "service"] }
ipnet = "2.11.0"
jsonschema = { version = "0.46.9", default-features = false }
jsonwebtoken = "9"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
mime_guess = "2"
notify = "8.2.0"
percent-encoding = "2.3.2"
proptest = "1.9.0"
rcgen = "0.13.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["fs"] }
rust-embed = "8"
# Already in the graph transitively: reqwest's `rustls` feature depends on it,
# and this is the same 0.7.x it resolves. Naming it directly adds a dependency
# edge, not a crate, and lets `gateway/src/egress/tls.rs` build the same
# extra-roots server verifier reqwest builds internally rather than approximating
# it. `default-features = false` keeps the `ffi-testing` feature -- the only one
# that would pull `rustls/ring` -- unreachable from here.
rustls-platform-verifier = { version = "0.7.0", default-features = false }
# Already in the graph transitively: this is the same 0.103.x `rustls` itself
# resolves and uses to verify certificates. Naming it directly adds a dependency
# edge, not a crate, and gives `gateway/src/auth/client_certificate.rs` the
# already-verified certificate's SAN accessors by name -- so the identity a
# client authenticates as is read by the same parser that verified the chain,
# rather than by an ASN.1 walk written here. No crypto backend feature is
# requested: nothing in this gateway asks webpki to verify a signature directly.
rustls-webpki = { version = "0.103.13", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
# `io-util` is named explicitly rather than inherited: `gateway/src/proxy/grpc/listen.rs`
# reads the HTTP/2 connection preface itself, which needs `AsyncReadExt`. It has
# always resolved into the graph through tokio-rustls and tokio-util, and a
# transitive feature is exactly the kind of thing that disappears on a bump.
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7.17", features = ["rt"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.7"
uuid = { version = "1.20.0", features = ["v4"] }
yaml_serde = "0.10.4"
zeroize = "1.8.2"
