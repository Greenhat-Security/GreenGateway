[package]
name = "gateway"
version = "1.0.1"
edition.workspace = true
license-file.workspace = true

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
chacha20poly1305.workspace = true
# Optional PostgreSQL support (issue #241 PR 3). All three are enabled together
# by the `postgres` feature; official builds get them through `default`, and a
# `--no-default-features` build refuses `STATE_BACKEND=postgres` at startup.
deadpool-postgres = { workspace = true, optional = true }
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
jsonschema.workspace = true
jsonwebtoken.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mime_guess.workspace = true
notify.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rmcp = { version = "2.1.0", features = ["client", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rusqlite.workspace = true
rust-embed.workspace = true
rustls-platform-verifier.workspace = true
rustls-webpki.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream = "0.2"
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
yaml_serde.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
rcgen.workspace = true
rustix.workspace = true

[features]
default = ["postgres"]
# PostgreSQL-backed cluster mode foundation (issue #241 PR 3). Feature-gated so
# a build can omit the PostgreSQL client entirely, and included in `default`
# because official builds (the Dockerfile runs `cargo build --release` with no
# feature flags) must ship it. Standalone mode is byte-for-byte unchanged when
# this feature compiles in: nothing activates without
# `STATE_BACKEND=postgres`, and a build without the feature fails startup if
# that setting selects PostgreSQL.
postgres = [
    "dep:deadpool-postgres",
    "dep:tokio-postgres",
    "dep:tokio-postgres-rustls",
]

# The multi-replica release-gate suites (issue #241 PR 16) live under
# `tests/ha/` so they can share one harness module. Cargo only
# auto-discovers `tests/*.rs`, so each suite is named here explicitly --
# one target per file, which is also what lets the CI gate parallelise
# them. `tests/ha/harness/` is a module of each, never a target of its own.
[[test]]
name = "ha_smoke"
path = "tests/ha/smoke.rs"

[[test]]
name = "ha_security_two_replica"
path = "tests/ha/security_two_replica.rs"

[[test]]
name = "ha_events_discovery_leader"
path = "tests/ha/events_discovery_leader.rs"

[[test]]
name = "ha_saturation"
path = "tests/ha/saturation.rs"

[[test]]
name = "ha_secret_leak"
path = "tests/ha/secret_leak.rs"

[[test]]
name = "ha_failure_matrix"
path = "tests/ha/failure_matrix.rs"

[[test]]
name = "ha_import_drill"
path = "tests/ha/import_drill.rs"

[[test]]
name = "ha_rolling_upgrade"
path = "tests/ha/rolling_upgrade.rs"

[[test]]
name = "ha_performance"
path = "tests/ha/performance.rs"
