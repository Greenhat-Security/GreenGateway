services:
  dev-jwks:
    image: python:3-slim
    command:
      - python
      - -m
      - http.server
      - "8080"
      - --bind
      - 0.0.0.0
      - --directory
      - /srv/jwks
    volumes:
      - ./dev/jwks/generated/public:/srv/jwks:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/jwks.json', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12

  dev-echo-a:
    image: python:3-slim
    command:
      - python
      - /srv/echo/echo-server.py
    environment:
      UPSTREAM_ID: dev-echo-a
      FAIL_RETRY_PROBE: "true"
    volumes:
      - ./dev/echo-server.py:/srv/echo/echo-server.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12

  dev-echo-b:
    image: python:3-slim
    command:
      - python
      - /srv/echo/echo-server.py
    environment:
      UPSTREAM_ID: dev-echo-b
    volumes:
      - ./dev/echo-server.py:/srv/echo/echo-server.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12

  dev-echo-c:
    image: python:3-slim
    command:
      - python
      - /srv/echo/echo-server.py
    environment:
      UPSTREAM_ID: dev-echo-c
    volumes:
      - ./dev/echo-server.py:/srv/echo/echo-server.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    depends_on:
      dev-jwks:
        condition: service_healthy
      dev-echo-a:
        condition: service_healthy
      dev-echo-b:
        condition: service_healthy
      dev-echo-c:
        condition: service_healthy
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      UPSTREAM_ROUTES: '[{"id":"dev-echo","path_prefix":"/__dev-echo","upstreams":[{"id":"dev-echo-a","url":"http://dev-echo-a:8080","weight":3},{"id":"dev-echo-b","url":"http://dev-echo-b:8080","weight":2},{"id":"dev-echo-c","url":"http://dev-echo-c:8080","weight":1}],"load_balancing":{"strategy":"weighted_round_robin"},"request_body":{"mode":"buffered"},"limits":{"max_in_flight":128,"queue_depth":256,"queue_timeout_ms":100},"health_check":{"method":"GET","path":"/ready","interval_ms":500,"jitter_ms":0,"timeout_ms":200,"healthy_threshold":2,"unhealthy_threshold":2,"expected_statuses":[200],"passive_failure_statuses":[500,502,504],"required_for_readiness":true,"minimum_healthy":2},"retry":{"max_attempts":2,"methods":["GET","HEAD","OPTIONS"],"statuses":[502,503,504]}},{"id":"dev-load","path_prefix":"/__dev-load","upstreams":[{"id":"dev-echo-a","url":"http://dev-echo-a:8080","weight":3},{"id":"dev-echo-b","url":"http://dev-echo-b:8080","weight":2},{"id":"dev-echo-c","url":"http://dev-echo-c:8080","weight":1}],"load_balancing":{"strategy":"weighted_round_robin"},"request_body":{"mode":"buffered"},"limits":{"max_in_flight":256,"queue_depth":512,"queue_timeout_ms":100},"timeout_ms":1500,"response_idle_timeout_ms":1000,"connect_timeout_ms":500,"retry":{"max_attempts":2,"methods":["GET","HEAD","OPTIONS"],"statuses":[502,503,504]}},{"id":"dev-stream","path_prefix":"/__dev-stream","upstreams":[{"id":"dev-echo-a","url":"http://dev-echo-a:8080","weight":3},{"id":"dev-echo-b","url":"http://dev-echo-b:8080","weight":2},{"id":"dev-echo-c","url":"http://dev-echo-c:8080","weight":1}],"load_balancing":{"strategy":"weighted_round_robin"},"request_body":{"mode":"stream"},"limits":{"max_in_flight":128,"queue_depth":256,"queue_timeout_ms":100},"timeout_ms":5000,"response_idle_timeout_ms":1000,"connect_timeout_ms":500}]'
      AUTH_ENABLED: "true"
      JWT_JWKS_URL: http://dev-jwks:8080/jwks.json
      JWT_ISSUER: https://greengateway.dev.local
      JWT_AUDIENCE: greengateway-dev
      JWT_REQUIRE_JTI: "true"
      ROLES_CLAIM: roles
      POLICY_FILE: /tmp/greengateway-dev-policy.json
      AUDIT_SQLITE_PATH: /tmp/greengateway-dev-audit.sqlite
      AUDIT_SQLITE_RETENTION_DAYS: "7"
      CORS_ALLOW_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      EGRESS_ALLOWED_HOSTS: dev-jwks
      EGRESS_DENY_PRIVATE_IPS: "false"
    volumes:
      - ./dev/policy.json:/tmp/greengateway-dev-policy.json:ro
