services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      SHUTDOWN_DRAIN_DELAY_MS: "5000"
      SHUTDOWN_TIMEOUT_MS: "30000"
      AUDIT_DRAIN_TIMEOUT_MS: "5000"
      # The audit store of record that the default AUDIT_DURABILITY=required
      # needs. /tmp is writable in the image as UID 10001; the file survives a
      # gateway restart in the same container, not a recreated one. Mount a
      # volume writable by UID 10001 and point this at it to keep the history.
      AUDIT_SQLITE_PATH: /tmp/greengateway-audit.sqlite
    stop_signal: SIGTERM
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/gateway
        - healthcheck
        - http://127.0.0.1:8080/readyz
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "8080:8080"
